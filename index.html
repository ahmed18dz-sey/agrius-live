<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AgriUS Marketplace - Comprehensive US Agricultural & Machinery Hub</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- React & ReactDOM CDN -->
    <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <!-- Babel for JSX -->
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
</head>
<body class="bg-slate-50 text-slate-800 font-sans">
    <div id="root"></div>

    <script type="text/babel">
        function AgriUSApp() {
            const [activeTab, setTab] = React.useState('home');
            const [selectedCategory, setSelectedCategory] = React.useState('All');
            const [searchQuery, setSearchQuery] = React.useState('');
            const [cart, setCart] = React.useState([]);
            const [originZip, setOriginZip] = React.useState('');
            const [destZip, setDestZip] = React.useState('');
            const [freightCost, setFreightCost] = React.useState(null);
            const [isModalOpen, setIsModalOpen] = React.useState(false);
            const [isRfqModalOpen, setIsRfqModalOpen] = React.useState(false);

            // Comprehensive US Agricultural Items
            const equipmentList = [
                { id: 1, category: "Heavy Machinery", title: "John Deere 8R 370 Row-Crop Tractor", price: 285000, location: "Iowa (ZIP: 50309)", weight: "24,500 lbs", image: "https://images.unsplash.com/photo-1592417817098-8f3d6eb26978?auto=format&fit=crop&w=800&q=80", verified: true },
                { id: 2, category: "Precision Ag", title: "DJI Agras T40 Agricultural Spraying Drone", price: 22500, location: "California (ZIP: 90210)", weight: "140 lbs", image: "https://images.unsplash.com/photo-1508614589041-895b88991e3e?auto=format&fit=crop&w=800&q=80", verified: true },
                { id: 3, category: "Irrigation & Solar", title: "Valmont Pivot Solar-Powered Irrigation System", price: 54000, location: "Texas (ZIP: 75201)", weight: "8,200 lbs", image: "https://images.unsplash.com/photo-1563514227147-6d2ff665a6a0?auto=format&fit=crop&w=800&q=80", verified: true },
                { id: 4, category: "Seeds & Bulk Inputs", title: "Certified Corn & Soybean Seeds (Bulk 50-Ton Pallets)", price: 18500, location: "Illinois (ZIP: 61701)", weight: "3,500 lbs", image: "https://images.unsplash.com/photo-1530836369250-ef72a3f5cda8?auto=format&fit=crop&w=800&q=80", verified: false },
                { id: 5, category: "Livestock & Feed", title: "Commercial Automated Livestock Feeding Bins & Silos", price: 32000, location: "Nebraska (ZIP: 68508)", weight: "6,100 lbs", image: "https://images.unsplash.com/photo-1500937386664-56d1dfef3854?auto=format&fit=crop&w=800&q=80", verified: true }
            ];

            const calculateFreight = () => {
                if (!originZip || !destZip) { alert('Please enter both Origin and Destination ZIP codes.'); return; }
                const distanceFactor = Math.abs(parseInt(originZip) - parseInt(destZip)) % 500 + 300;
                setFreightCost(distanceFactor);
            };

            const filteredItems = equipmentList.filter(item => {
                const matchesCat = selectedCategory === 'All' || item.category === selectedCategory;
                const matchesSearch = item.title.toLowerCase().includes(searchQuery.toLowerCase()) || item.location.toLowerCase().includes(searchQuery.toLowerCase());
                return matchesCat && matchesSearch;
            });

            return (
                <div className="min-h-screen flex flex-col justify-between">
                    <div>
                        {/* Trust & Trade Banner */}
                        <div className="bg-emerald-950 text-emerald-100 text-xs py-2 px-4 flex justify-between items-center">
                            <div className="flex items-center gap-2">
                                <span>🛡️</span>
                                <span>AgriUS Trade Assurance | 10% Deposit + Pay on Delivery | Verified US Dealers</span>
                            </div>
                            <div className="flex gap-4">
                                <button onClick={() => setIsRfqModalOpen(true)} className="text-amber-400 font-bold hover:underline">Request for Quotation (RFQ)</button>
                            </div>
                        </div>

                        {/* Navbar */}
                        <header className="bg-white border-b border-slate-200 sticky top-0 z-50 shadow-sm">
                            <div className="max-w-7xl mx-auto px-4 py-3 flex justify-between items-center">
                                <div className="flex items-center gap-2 cursor-pointer" onClick={() => setTab('home')}>
                                    <div className="bg-emerald-600 text-white p-2 rounded-xl text-lg">🚜</div>
                                    <div>
                                        <h1 className="text-xl font-black text-emerald-900">AgriUS<span className="text-amber-600">Market</span></h1>
                                        <p className="text-[10px] text-slate-500 uppercase tracking-widest">US Agricultural Supply & Freight Hub</p>
                                    </div>
                                </div>
                                <nav className="hidden md:flex gap-6 font-medium text-sm">
                                    <button onClick={() => setTab('home')} className={activeTab === 'home' ? 'text-emerald-600 font-bold' : 'hover:text-emerald-600'}>Home</button>
                                    <button onClick={() => setTab('market')} className={activeTab === 'market' ? 'text-emerald-600 font-bold' : 'hover:text-emerald-600'}>Full Marketplace</button>
                                    <button onClick={() => setTab('logistics')} className={activeTab === 'logistics' ? 'text-emerald-600 font-bold' : 'hover:text-emerald-600'}>Logistics & Heavy Haul</button>
                                </nav>
                                <div className="flex items-center gap-3">
                                    <button onClick={() => setIsModalOpen(true)} className="relative bg-slate-100 hover:bg-slate-200 p-2.5 rounded-full text-sm">
                                        🛒
                                        {cart.length > 0 && <span className="absolute -top-1 -right-1 bg-amber-500 text-white text-xs font-bold w-5 h-5 rounded-full flex items-center justify-center">{cart.length}</span>}
                                    </button>
                                </div>
                            </div>
                        </header>

                        {/* Main Body */}
                        <main className="max-w-7xl mx-auto px-4 py-6 space-y-8">
                            {activeTab === 'home' && (
                                <div className="space-y-12">
                                    <div className="relative rounded-2xl overflow-hidden bg-gradient-to-r from-emerald-900 to-slate-900 text-white p-10 md:p-16 shadow-2xl space-y-6">
                                        <span className="bg-amber-500 text-slate-950 text-xs font-bold px-3 py-1 rounded-full uppercase">Alibaba-Style US Agricultural Platform</span>
                                        <h2 className="text-3xl md:text-5xl font-extrabold max-w-2xl leading-tight">Empowering American Farmers, Dealers & Bulk Buyers</h2>
                                        <p className="text-slate-300 max-w-xl text-sm md:text-base">Everything from heavy-duty tractors and precision drones to bulk seeds, fertilizers, and solar irrigation systems with automated ZIP-to-ZIP freight quotes.</p>
                                        <div className="flex gap-4">
                                            <button onClick={() => setTab('market')} className="bg-emerald-500 hover:bg-emerald-600 text-white font-bold px-6 py-3 rounded-xl shadow">Explore All Categories ➡️</button>
                                            <button onClick={() => setIsRfqModalOpen(true)} className="bg-white/10 hover:bg-white/20 border border-white/30 text-white font-bold px-6 py-3 rounded-xl">Submit Bulk RFQ</button>
                                        </div>
                                    </div>

                                    {/* Features Grid */}
                                    <div className="grid grid-cols-1 md:grid-cols-3 gap-6">
                                        <div className="bg-white p-6 rounded-2xl border border-slate-200 shadow-sm space-y-2">
                                            <div className="text-2xl">🛡️</div>
                                            <h3 className="font-bold text-lg">Trade Assurance</h3>
                                            <p className="text-sm text-slate-500">Secure 10% online deposit escrow with balance payable upon on-site delivery and inspection.</p>
                                        </div>
                                        <div className="bg-white p-6 rounded-2xl border border-slate-200 shadow-sm space-y-2">
                                            <div className="text-2xl">🚛</div>
                                            <h3 className="font-bold text-lg">Heavy Haul Logistics</h3>
                                            <p className="text-sm text-slate-500">Instant freight calculation across US ZIP codes paired with reliable carriers like uShip and FedEx Freight.</p>
                                        </div>
                                        <div className="bg-white p-6 rounded-2xl border border-slate-200 shadow-sm space-y-2">
                                            <div className="text-2xl">🌾</div>
                                            <h3 className="font-bold text-lg">Complete Ag Ecosystem</h3>
                                            <p className="text-sm text-slate-500">Machinery, seeds, bulk inputs, water systems, and livestock equipment in one centralized marketplace.</p>
                                        </div>
                                    </div>
                                </div>
                            )}

                            {activeTab === 'market' && (
                                <div className="space-y-6">
                                    {/* Search & Categories */}
                                    <div className="flex flex-col md:flex-row justify-between gap-4 bg-white p-4 rounded-2xl border border-slate-200">
                                        <input 
                                            type="text" 
                                            placeholder="Search machinery, seeds, drones..." 
                                            value={searchQuery}
                                            onChange={e => setSearchQuery(e.target.value)}
                                            className="w-full md:w-80 p-2.5 border rounded-xl text-sm"
                                        />
                                        <div className="flex gap-2 overflow-x-auto pb-2 md:pb-0">
                                            {['All', 'Heavy Machinery', 'Precision Ag', 'Irrigation & Solar', 'Seeds & Bulk Inputs', 'Livestock & Feed'].map(cat => (
                                                <button 
                                                    key={cat} 
                                                    onClick={() => setSelectedCategory(cat)}
                                                    className={`px-3 py-1.5 rounded-lg text-xs font-semibold whitespace-nowrap ${selectedCategory === cat ? 'bg-emerald-600 text-white' : 'bg-slate-100 text-slate-600'}`}
                                                >
                                                    {cat}
                                                </button>
                                            ))}
                                        </div>
                                    </div>

                                    {/* Grid */}
                                    <div className="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6">
                                        {filteredItems.map(item => (
                                            <div key={item.id} className="bg-white rounded-2xl border border-slate-200 overflow-hidden shadow-sm flex flex-col justify-between">
                                                <div>
                                                    <div className="relative h-48 bg-slate-100">
                                                        <img src={item.image} alt={item.title} className="w-full h-full object-cover" />
                                                        {item.verified && <span className="absolute top-3 left-3 bg-blue-600 text-white text-[10px] font-bold px-2.5 py-1 rounded-full">✓ Verified Dealer</span>}
                                                        <span className="absolute bottom-3 right-3 bg-slate-900/85 text-white text-xs font-bold px-2.5 py-1 rounded-lg">${item.price.toLocaleString()} USD</span>
                                                    </div>
                                                    <div className="p-4 space-y-1">
                                                        <span className="text-[10px] text-emerald-600 font-bold uppercase">{item.category}</span>
                                                        <h3 className="font-bold text-slate-900">{item.title}</h3>
                                                        <p className="text-xs text-slate-500">📍 {item.location}</p>
                                                        <p className="text-xs text-slate-600">Weight: <strong>{item.weight}</strong></p>
                                                    </div>
                                                </div>
                                                <div className="p-4 pt-0">
                                                    <button onClick={() => { setCart([...cart, item]); setIsModalOpen(true); }} className="w-full bg-slate-900 hover:bg-emerald-600 text-white text-xs font-semibold py-2.5 rounded-xl transition">
                                                        Request Quote / Add to Cart
                                                    </button>
                                                </div>
                                            </div>
                                        ))}
                                    </div>
                                </div>
                            )}

                            {activeTab === 'logistics' && (
                                <div className="max-w-2xl mx-auto bg-white p-8 rounded-2xl border border-slate-200 shadow-sm space-y-6">
                                    <div className="space-y-2">
                                        <span className="bg-emerald-100 text-emerald-800 text-xs font-bold px-3 py-1 rounded-full">US Heavy Haul & Freight Calculator</span>
                                        <h2 className="text-2xl font-black">ZIP-to-ZIP Logistics Estimation</h2>
                                        <p className="text-slate-500 text-sm">Calculate precise heavy freight shipping costs across the United States using simulated uShip and FedEx Freight APIs.</p>
                                    </div>
                                    <div className="grid grid-cols-2 gap-4">
                                        <div>
                                            <label className="block text-xs font-bold uppercase mb-1">Origin US ZIP</label>
                                            <input type="text" placeholder="e.g. 50309 (Iowa)" value={originZip} onChange={e => setOriginZip(e.target.value)} className="w-full p-3 border rounded-xl text-sm" />
                                        </div>
                                        <div>
                                            <label className="block text-xs font-bold uppercase mb-1">Destination US ZIP</label>
                                            <input type="text" placeholder="e.g. 90210 (California)" value={destZip} onChange={e => setDestZip(e.target.value)} className="w-full p-3 border rounded-xl text-sm" />
                                        </div>
                                    </div>
                                    <button onClick={calculateFreight} className="w-full bg-emerald-600 hover:bg-emerald-700 text-white font-bold py-3.5 rounded-xl shadow">
                                        Calculate Freight Quote
                                    </button>
                                    {freightCost && (
                                        <div className="bg-emerald-50 p-4 rounded-xl border border-emerald-200 text-center space-y-1">
                                            <p className="text-xs text-emerald-800 uppercase font-bold">Estimated Heavy Haul Freight Rate</p>
                                            <p className="text-2xl font-black text-emerald-900">${freightCost} USD</p>
                                            <p className="text-[11px] text-slate-500">Includes oversize permits and tailgate delivery insurance.</p>
                                        </div>
                                    )}
                                </div>
                            )}
                        </main>
                    </div>

                    {/* Cart Modal */}
                    {isModalOpen && (
                        <div className="fixed inset-0 bg-slate-900/60 flex items-center justify-center p-4 z-50">
                            <div className="bg-white w-full max-w-lg rounded-2xl p-6 space-y-4">
                                <div className="flex justify-between items-center font-bold text-lg">
                                    <h3>Order Checkout & Trade Assurance</h3>
                                    <button onClick={() => setIsModalOpen(false)}>✕</button>
                                </div>
                                {cart.length === 0 ? <p className="text-sm text-slate-500">Your cart is empty.</p> : (
                                    cart.map((i, idx) => (
                                        <div key={idx} className="flex justify-between text-sm border-b pb-2">
                                            <span>{i.title}</span>
                                            <span className="font-bold text-emerald-600">${i.price.toLocaleString()}</span>
                                        </div>
                                    ))
                                )}
                                <div className="bg-slate-50 p-3 rounded-xl text-xs space-y-1">
                                    <p className="font-bold text-slate-700">Payment Structure:</p>
                                    <p className="text-slate-500">• 10% Online Escrow Deposit required now.</p>
                                    <p className="text-slate-500">• 90% Balance paid upon delivery and on-site inspection.</p>
                                </div>
                                <button onClick={() => { alert('Secure Order & Trade Assurance initiated successfully!'); setCart([]); setIsModalOpen(false); }} className="w-full bg-emerald-600 text-white font-bold py-3 rounded-xl">
                                    Confirm Secure Deposit Order
                                </button>
                            </div>
                        </div>
                    )}

                    {/* RFQ Modal */}
                    {isModalOpen === false && isRfqModalOpen && (
                        <div className="fixed inset-0 bg-slate-900/60 flex items-center justify-center p-4 z-50">
                            <div className="bg-white w-full max-w-md rounded-2xl p-6 space-y-4">
                                <div className="flex justify-between items-center font-bold text-lg">
                                    <h3>Request for Quotation (RFQ)</h3>
                                    <button onClick={() => setIsRfqModalOpen(false)}>✕</button>
                                </div>
                                <p className="text-xs text-slate-500">Looking for bulk agricultural supplies or heavy machinery fleets? Submit your specifications directly to verified US suppliers.</p>
                                <input type="text" placeholder="Your Farm or Company Name" className="w-full p-2.5 border rounded-xl text-sm" />
                                <input type="text" placeholder="Equipment / Supplies Needed (e.g. 5x Tractors)" className="w-full p-2.5 border rounded-xl text-sm" />
                                <input type="text" placeholder="Target Delivery ZIP Code" className="w-full p-2.5 border rounded-xl text-sm" />
                                <button onClick={() => { alert('RFQ submitted successfully to 42 verified US suppliers!'); setIsRfqModalOpen(false); }} className="w-full bg-amber-600 hover:bg-amber-700 text-white font-bold py-3 rounded-xl">
                                    Broadcast RFQ to Suppliers
                                </button>
                            </div>
                        </div>
                    )}

                    {/* Footer */}
                    <footer className="bg-slate-900 text-slate-400 text-xs py-6 px-4 text-center mt-12 border-t border-slate-800">
                        <p>© 2026 AgriUS Marketplace Inc. All rights reserved. Connecting American Agriculture.</p>
                    </footer>
                </div>
            );
        }

        ReactDOM.createRoot(document.getElementById('root')).render(<AgriUSApp />);
    </script>
</body>
</html>
