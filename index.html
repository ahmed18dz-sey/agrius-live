<!DOCTYPE html>
<html lang="en" class="h-full bg-slate-50">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AgriUS Marketplace | Heavy Farm Machinery & Agricultural Equipment</title>
    
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        agri: {
                            50: '#f0fdf4',
                            100: '#dcfce7',
                            500: '#22c55e',
                            600: '#16a34a',
                            700: '#15803d',
                            800: '#166534',
                            900: '#14532d',
                        },
                        amberGold: '#d97706',
                    }
                }
            }
        }
    </script>

    <!-- FontAwesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">

    <!-- React 18 & Babel CDN -->
    <script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

    <style>
        body { font-family: 'Inter', sans-serif; }
        .glass-nav {
            background: rgba(255, 255, 255, 0.95);
            backdrop-filter: blur(8px);
        }
        .gradient-banner {
            background: linear-gradient(135deg, #14532d 0%, #15803d 50%, #1e3a8a 100%);
        }
        .custom-scrollbar::-webkit-scrollbar {
            width: 6px;
            height: 6px;
        }
        .custom-scrollbar::-webkit-scrollbar-track {
            background: #f1f1f1;
        }
        .custom-scrollbar::-webkit-scrollbar-thumb {
            background: #cbd5e1;
            border-radius: 4px;
        }
    </style>
</head>
<body class="h-full text-slate-800">
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect, useMemo } = React;

        // --- MOCK INITIAL DATA ---
        const INITIAL_LISTINGS = [
            {
                id: "AG-101",
                title: "2022 John Deere 8R 410 Tractor",
                category: "Tractors",
                price: 345000,
                location: "Des Moines, IA (ZIP 50301)",
                zip: "50301",
                hours: 840,
                hp: 410,
                condition: "Like New",
                seller: "Midwest Agri Fleet Inc.",
                verified: true,
                status: "approved",
                tier: "Enterprise",
                image: "https://images.unsplash.com/photo-1592982537447-7440770cbfc9?auto=format&fit=crop&w=800&q=80",
                description: "Clean, single-owner 8R 410 with Signature Edition package, CommandPro transmission, and Duals. Full warranty remaining until late 2026."
            },
            {
                id: "AG-102",
                title: "2021 Case IH Axial-Flow 8250 Combine",
                category: "Combines & Harvesting",
                price: 389000,
                location: "Fargo, ND (ZIP 58102)",
                zip: "58102",
                hours: 620,
                hp: 480,
                condition: "Excellent",
                seller: "Red River Dealers Co.",
                verified: true,
                status: "approved",
                tier: "Commercial",
                image: "https://images.unsplash.com/photo-1595246140625-573b715d11dc?auto=format&fit=crop&w=800&q=80",
                description: "Includes 40ft Draper Head, Luxury Cab, Automation package, and extended auger. Ready for wheat & corn."
            },
            {
                id: "AG-103",
                title: "2023 Kinze 4905 24-Row Planter",
                category: "Tillage & Planting",
                price: 215000,
                location: "Lincoln, NE (ZIP 68502)",
                zip: "68502",
                hours: 120,
                hp: 0,
                condition: "Mint",
                seller: "Cornhusker Ag Sales",
                verified: true,
                status: "approved",
                tier: "Commercial",
                image: "https://images.unsplash.com/photo-1586771107445-d3ca888129ff?auto=format&fit=crop&w=800&q=80",
                description: "Electric drive, liquid fertilizer system, hydraulic weight transfer. Used for only one planting season."
            },
            {
                id: "AG-104",
                title: "2020 Apache AS1250 Self-Propelled Sprayer",
                category: "Sprayers & Applicators",
                price: 185000,
                location: "Sioux Falls, SD (ZIP 57101)",
                zip: "57101",
                hours: 1100,
                hp: 300,
                condition: "Good",
                seller: "Dakota Custom Ag",
                verified: false,
                status: "approved",
                tier: "Verified Farmer",
                image: "https://images.unsplash.com/photo-1500937386664-56d1dfef3854?auto=format&fit=crop&w=800&q=80",
                description: "1200-gallon stainless tank, 120ft aluminum boom, Raven Hawkeye PWM system."
            },
            {
                id: "AG-105",
                title: "2023 Brent 1198 Grain Cart",
                category: "Grain Handling",
                price: 92000,
                location: "Peoria, IL (ZIP 61602)",
                zip: "61602",
                hours: 50,
                hp: 0,
                condition: "Brand New",
                seller: "Heartland Heavy Equipment",
                verified: true,
                status: "approved",
                tier: "Enterprise",
                image: "https://images.unsplash.com/photo-1625246333195-78d9c38ad449?auto=format&fit=crop&w=800&q=80",
                description: "1100 bushel capacity, track system, auto-tarp, Digi-Star scale system."
            },
            {
                id: "AG-106",
                title: "2024 Kubota M8-201 Utility Tractor",
                category: "Tractors",
                price: 168000,
                location: "Amarillo, TX (ZIP 79101)",
                zip: "79101",
                hours: 15,
                hp: 200,
                condition: "Brand New",
                seller: "Panhandle Power Ag",
                verified: false,
                status: "pending",
                tier: "Commercial",
                image: "https://images.unsplash.com/photo-1530267981375-f0de937f5f13?auto=format&fit=crop&w=800&q=80",
                description: "Dealer demo unit with full factory warranty. Semi-powershift, front suspension."
            }
        ];

        const INITIAL_RFQS = [
            { id: "RFQ-801", item: "Looking for 12-Row Corn Head (30-inch)", budget: "$45,000 - $60,000", buyer: "Valley Farms LLC", zip: "68102", status: "Active", responses: 4 },
            { id: "RFQ-802", item: "Bulk Purchase: Certified Non-GMO Soybean Seed (500 Bags)", budget: "$30,000", buyer: "AgriCoop North", zip: "50010", status: "Active", responses: 2 },
            { id: "RFQ-803", item: "Late Model 500HP Quadtrac Tractor Rental (3 Months)", budget: "$25,000", buyer: "Great Plains Grain", zip: "67202", status: "Closed", responses: 8 }
        ];

        function App() {
            // --- STATE MANAGEMENT ---
            const [listings, setListings] = useState(() => {
                const saved = localStorage.getItem('agrius_listings');
                return saved ? JSON.parse(saved) : INITIAL_LISTINGS;
            });

            const [rfqs, setRfqs] = useState(() => {
                const saved = localStorage.getItem('agrius_rfqs');
                return saved ? JSON.parse(saved) : INITIAL_RFQS;
            });

            const [currentUser, setCurrentUser] = useState(() => {
                const saved = localStorage.getItem('agrius_user');
                return saved ? JSON.parse(saved) : {
                    name: "John Miller",
                    email: "john@millerfarms.com",
                    role: "Customer", // Options: "Customer", "Dealer", "Admin"
                    tier: "Verified Farmer",
                    verified: true,
                    zip: "50301"
                };
            });

            const [activeTab, setActiveTab] = useState('marketplace'); // marketplace, rfq, freight, subscriptions, dashboard, admin
            const [selectedCategory, setSelectedCategory] = useState('All');
            const [searchQuery, setSearchQuery] = useState('');
            const [selectedListing, setSelectedListing] = useState(null);
            
            // Modal States
            const [showPaymentModal, setShowPaymentModal] = useState(false);
            const [paymentContext, setPaymentContext] = useState(null); // { type: 'subscription' | 'checkout', plan?: any, item?: any }
            const [showSupabaseModal, setShowSupabaseModal] = useState(false);
            const [showNewListingModal, setShowNewListingModal] = useState(false);
            const [editingListing, setEditingListing] = useState(null);

            // Save to localStorage
            useEffect(() => {
                localStorage.setItem('agrius_listings', JSON.stringify(listings));
            }, [listings]);

            useEffect(() => {
                localStorage.setItem('agrius_rfqs', JSON.stringify(rfqs));
            }, [rfqs]);

            useEffect(() => {
                localStorage.setItem('agrius_user', JSON.stringify(currentUser));
            }, [currentUser]);

            // Filtered listings for public marketplace
            const publicListings = useMemo(() => {
                return listings.filter(item => {
                    const matchesStatus = item.status === 'approved' || currentUser.role === 'Admin';
                    const matchesCategory = selectedCategory === 'All' || item.category === selectedCategory;
                    const matchesSearch = item.title.toLowerCase().includes(searchQuery.toLowerCase()) || 
                                          item.description.toLowerCase().includes(searchQuery.toLowerCase()) ||
                                          item.seller.toLowerCase().includes(searchQuery.toLowerCase());
                    return matchesStatus && matchesCategory && matchesSearch;
                });
            }, [listings, selectedCategory, searchQuery, currentUser]);

            // CRUD Handlers
            const handleAddListing = (newListing) => {
                const listingToAdd = {
                    ...newListing,
                    id: `AG-${Math.floor(100 + Math.random() * 900)}`,
                    status: currentUser.role === 'Admin' ? 'approved' : 'pending',
                    seller: currentUser.name,
                    verified: currentUser.verified,
                    tier: currentUser.tier
                };
                setListings([listingToAdd, ...listings]);
                setShowNewListingModal(false);
                alert(currentUser.role === 'Admin' 
                    ? "Listing published directly!" 
                    : "Listing submitted! Pending Admin Approval.");
            };

            const handleUpdateListing = (updated) => {
                setListings(listings.map(l => l.id === updated.id ? updated : l));
                setEditingListing(null);
            };

            const handleDeleteListing = (id) => {
                if(confirm("Are you sure you want to delete this listing permanently?")) {
                    setListings(listings.filter(l => l.id !== id));
                    if (selectedListing?.id === id) setSelectedListing(null);
                }
            };

            const handleApproveReject = (id, status) => {
                setListings(listings.map(l => l.id === id ? { ...l, status } : l));
            };

            // Switch User Role Simulation
            const handleUserRoleChange = (role) => {
                const updated = {
                    ...currentUser,
                    role: role,
                    tier: role === 'Admin' ? 'Enterprise' : (role === 'Dealer' ? 'Commercial' : 'Verified Farmer')
                };
                setCurrentUser(updated);
            };

            return (
                <div className="min-h-screen flex flex-col bg-slate-50">
                    {/* Top Announcement Bar */}
                    <div className="bg-slate-900 text-slate-300 text-xs py-2 px-4 flex justify-between items-center border-b border-slate-800">
                        <div className="flex items-center space-x-4">
                            <span><i className="fa-solid fa-shield-halved text-agri-500 mr-1"></i> AgriUS Escrow Protected</span>
                            <span className="hidden md:inline"><i className="fa-solid fa-truck-fast text-blue-400 mr-1"></i> Freight Shipping nationwide</span>
                        </div>
                        <div className="flex items-center space-x-4">
                            <span className="text-slate-400">View mode:</span>
                            <div className="flex bg-slate-800 p-0.5 rounded text-[11px] font-semibold">
                                <button 
                                    onClick={() => handleUserRoleChange('Customer')} 
                                    className={`px-2 py-0.5 rounded ${currentUser.role === 'Customer' ? 'bg-agri-600 text-white' : 'text-slate-400 hover:text-white'}`}>
                                    Buyer/Farmer
                                </button>
                                <button 
                                    onClick={() => handleUserRoleChange('Dealer')} 
                                    className={`px-2 py-0.5 rounded ${currentUser.role === 'Dealer' ? 'bg-agri-600 text-white' : 'text-slate-400 hover:text-white'}`}>
                                    Commercial Dealer
                                </button>
                                <button 
                                    onClick={() => handleUserRoleChange('Admin')} 
                                    className={`px-2 py-0.5 rounded ${currentUser.role === 'Admin' ? 'bg-amberGold text-white' : 'text-slate-400 hover:text-white'}`}>
                                    <i className="fa-solid fa-user-gear mr-1"></i>Admin Mode
                                </button>
                            </div>
                        </div>
                    </div>

                    {/* Navigation Bar */}
                    <nav className="sticky top-0 z-40 glass-nav border-b border-slate-200 shadow-sm">
                        <div className="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
                            <div className="flex justify-between h-16">
                                <div className="flex items-center space-x-8">
                                    <div className="flex items-center cursor-pointer" onClick={() => setActiveTab('marketplace')}>
                                        <div className="bg-agri-700 text-white p-2 rounded-xl mr-2 shadow">
                                            <i className="fa-solid fa-wheat-awn text-xl"></i>
                                        </div>
                                        <div>
                                            <span className="font-black text-2xl tracking-tight text-slate-900">Agri<span className="text-agri-600">US</span></span>
                                            <span className="block text-[10px] uppercase font-bold tracking-widest text-slate-400 -mt-1">Commercial Marketplace</span>
                                        </div>
                                    </div>

                                    <div className="hidden lg:flex space-x-1">
                                        {[
                                            { id: 'marketplace', label: 'Marketplace', icon: 'fa-store' },
                                            { id: 'rfq', label: 'RFQ Board', icon: 'fa-file-signature' },
                                            { id: 'freight', label: 'Freight Calculator', icon: 'fa-calculator' },
                                            { id: 'subscriptions', label: 'Membership Plans', icon: 'fa-gem' },
                                        ].map(tab => (
                                            <button
                                                key={tab.id}
                                                onClick={() => setActiveTab(tab.id)}
                                                className={`px-3 py-2 rounded-lg text-sm font-medium transition-colors flex items-center space-x-2 ${
                                                    activeTab === tab.id 
                                                        ? 'bg-agri-50 text-agri-700 font-semibold' 
                                                        : 'text-slate-600 hover:text-slate-900 hover:bg-slate-100'
                                                }`}
                                            >
                                                <i className={`fa-solid ${tab.icon} text-xs`}></i>
                                                <span>{tab.label}</span>
                                            </button>
                                        ))}
                                    </div>
                                </div>

                                <div className="flex items-center space-x-3">
                                    <button 
                                        onClick={() => setShowNewListingModal(true)}
                                        className="bg-agri-600 hover:bg-agri-700 text-white font-semibold px-4 py-2 rounded-lg shadow-sm text-sm transition flex items-center space-x-2"
                                    >
                                        <i className="fa-solid fa-plus"></i>
                                        <span>Sell Equipment</span>
                                    </button>

                                    {/* Admin Direct Access Pill */}
                                    {currentUser.role === 'Admin' && (
                                        <button 
                                            onClick={() => setActiveTab('admin')}
                                            className={`px-3 py-2 rounded-lg text-sm font-semibold flex items-center space-x-1 ${
                                                activeTab === 'admin' ? 'bg-amber-600 text-white' : 'bg-amber-100 text-amber-800 hover:bg-amber-200'
                                            }`}
                                        >
                                            <i className="fa-solid fa-screwdriver-wrench"></i>
                                            <span>Admin Panel</span>
                                            {listings.filter(l => l.status === 'pending').length > 0 && (
                                                <span className="ml-1 bg-red-600 text-white text-[10px] px-1.5 py-0.5 rounded-full">
                                                    {listings.filter(l => l.status === 'pending').length}
                                                </span>
                                            )}
                                        </button>
                                    )}

                                    {/* User Profile Button */}
                                    <button 
                                        onClick={() => setActiveTab('dashboard')}
                                        className="flex items-center space-x-2 p-1.5 rounded-lg border border-slate-200 hover:bg-slate-100 transition"
                                    >
                                        <div className="w-8 h-8 bg-slate-800 text-white rounded-full flex items-center justify-center font-bold text-xs">
                                            {currentUser.name.split(' ').map(n=>n[0]).join('')}
                                        </div>
                                        <div className="text-left hidden sm:block text-xs">
                                            <div className="font-semibold text-slate-800 leading-tight">{currentUser.name}</div>
                                            <div className="text-agri-600 font-medium">{currentUser.tier}</div>
                                        </div>
                                    </button>
                                </div>
                            </div>
                        </div>
                    </nav>

                    {/* MAIN CONTENT AREA */}
                    <main className="flex-grow">
                        {activeTab === 'marketplace' && (
                            <MarketplaceView 
                                listings={publicListings} 
                                categories={['All', 'Tractors', 'Combines & Harvesting', 'Tillage & Planting', 'Sprayers & Applicators', 'Grain Handling']}
                                selectedCategory={selectedCategory}
                                setSelectedCategory={setSelectedCategory}
                                searchQuery={searchQuery}
                                setSearchQuery={setSearchQuery}
                                onSelectListing={(item) => setSelectedListing(item)}
                                onOpenFreight={() => setActiveTab('freight')}
                            />
                        )}

                        {activeTab === 'rfq' && (
                            <RFQBoardView rfqs={rfqs} setRfqs={setRfqs} currentUser={currentUser} />
                        )}

                        {activeTab === 'freight' && (
                            <FreightCalculatorView listings={listings} />
                        )}

                        {activeTab === 'subscriptions' && (
                            <SubscriptionsView 
                                currentUser={currentUser} 
                                onSelectPlan={(plan) => {
                                    setPaymentContext({ type: 'subscription', plan });
                                    setShowPaymentModal(true);
                                }} 
                            />
                        )}

                        {activeTab === 'dashboard' && (
                            <UserDashboardView 
                                currentUser={currentUser} 
                                listings={listings.filter(l => l.seller === currentUser.name)}
                                onUpgrade={() => setActiveTab('subscriptions')}
                                onNewListing={() => setShowNewListingModal(true)}
                            />
                        )}

                        {activeTab === 'admin' && (
                            <AdminPanelView 
                                listings={listings}
                                rfqs={rfqs}
                                onApproveReject={handleApproveReject}
                                onDelete={handleDeleteListing}
                                onEdit={(item) => setEditingListing(item)}
                                onOpenSupabase={() => setShowSupabaseModal(true)}
                            />
                        )}
                    </main>

                    {/* ITEM DETAIL MODAL */}
                    {selectedListing && (
                        <ItemDetailModal 
                            item={selectedListing} 
                            onClose={() => setSelectedListing(null)}
                            onBuyNow={(item) => {
                                setPaymentContext({ type: 'checkout', item });
                                setShowPaymentModal(true);
                            }}
                            onCalculateFreight={() => {
                                setSelectedListing(null);
                                setActiveTab('freight');
                            }}
                        />
                    )}

                    {/* PAYMENT GATEWAY MODAL */}
                    {showPaymentModal && paymentContext && (
                        <PaymentGatewayModal 
                            context={paymentContext} 
                            currentUser={currentUser}
                            onClose={() => setShowPaymentModal(false)}
                            onSuccess={(details) => {
                                if (paymentContext.type === 'subscription') {
                                    setCurrentUser({ ...currentUser, tier: paymentContext.plan.name });
                                    alert(`Payment Successful! Upgraded to ${paymentContext.plan.name} Tier.`);
                                } else {
                                    alert(`Escrow Order Processed Successfully! Tracking ID: #${Math.floor(100000 + Math.random() * 900000)}`);
                                }
                                setShowPaymentModal(false);
                            }}
                        />
                    )}

                    {/* NEW / EDIT LISTING MODAL */}
                    {(showNewListingModal || editingListing) && (
                        <ListingFormModal 
                            initialData={editingListing}
                            onClose={() => { setShowNewListingModal(false); setEditingListing(null); }}
                            onSubmit={(data) => {
                                if (editingListing) {
                                    handleUpdateListing({ ...editingListing, ...data });
                                } else {
                                    handleAddListing(data);
                                }
                            }}
                        />
                    )}

                    {/* SUPABASE CLOUD SETUP MODAL */}
                    {showSupabaseModal && (
                        <SupabaseConfigModal onClose={() => setShowSupabaseModal(false)} />
                    )}

                    {/* FOOTER */}
                    <footer className="bg-slate-900 text-slate-400 border-t border-slate-800 mt-16 py-12">
                        <div className="max-w-7xl mx-auto px-4 grid grid-cols-1 md:grid-cols-4 gap-8">
                            <div>
                                <div className="flex items-center text-white font-bold text-xl mb-3">
                                    <i className="fa-solid fa-wheat-awn text-agri-500 mr-2"></i> AgriUS Market
                                </div>
                                <p className="text-xs leading-relaxed text-slate-400">
                                    North America’s leading verified B2B marketplace for heavy agricultural equipment, fleet sales, and bulk crop inputs.
                                </p>
                            </div>
                            <div>
                                <h4 className="text-white font-semibold text-sm mb-3">Quick Navigation</h4>
                                <ul className="space-y-2 text-xs">
                                    <li><a href="#" onClick={() => setActiveTab('marketplace')} className="hover:text-white">Browse Tractors</a></li>
                                    <li><a href="#" onClick={() => setActiveTab('rfq')} className="hover:text-white">RFQ Buying Requests</a></li>
                                    <li><a href="#" onClick={() => setActiveTab('freight')} className="hover:text-white">Heavy Freight Rates</a></li>
                                    <li><a href="#" onClick={() => setActiveTab('subscriptions')} className="hover:text-white">Dealer Membership Tiers</a></li>
                                </ul>
                            </div>
                            <div>
                                <h4 className="text-white font-semibold text-sm mb-3">Escrow & Protection</h4>
                                <p className="text-xs text-slate-400 mb-2">
                                    All high-value transactions are protected by AgriUS Trade Assurance Escrow. Funds are released only upon delivery inspection.
                                </p>
                                <span className="inline-block bg-slate-800 text-agri-400 text-[10px] px-2 py-1 rounded font-mono border border-slate-700">
                                    <i className="fa-solid fa-lock mr-1"></i> 256-Bit SSL Encrypted
                                </span>
                            </div>
                            <div>
                                <h4 className="text-white font-semibold text-sm mb-3">Admin Access</h4>
                                <p className="text-xs text-slate-400 mb-2">Platform Owner or Inspector?</p>
                                <button 
                                    onClick={() => { handleUserRoleChange('Admin'); setActiveTab('admin'); }}
                                    className="w-full bg-slate-800 hover:bg-slate-700 text-white text-xs font-semibold py-2 px-3 rounded border border-slate-700 flex items-center justify-center space-x-2"
                                >
                                    <i className="fa-solid fa-key text-amber-400"></i>
                                    <span>Open Admin Dashboard</span>
                                </button>
                            </div>
                        </div>
                        <div className="max-w-7xl mx-auto px-4 mt-8 pt-6 border-t border-slate-800 text-center text-xs text-slate-500">
                            &copy; 2026 AgriUS Marketplace Inc. All rights reserved. Built for U.S. Agriculture & Commercial Dealers.
                        </div>
                    </footer>
                </div>
            );
        }

        // ==================== VIEWS ==================== //

        // 1. MARKETPLACE VIEW
        function MarketplaceView({ listings, categories, selectedCategory, setSelectedCategory, searchQuery, setSearchQuery, onSelectListing, onOpenFreight }) {
            return (
                <div>
                    {/* Hero Header */}
                    <div className="gradient-banner text-white py-12 px-4">
                        <div className="max-w-5xl mx-auto text-center">
                            <span className="inline-block bg-agri-500/20 text-agri-300 font-semibold text-xs px-3 py-1 rounded-full border border-agri-400/30 mb-3">
                                Verified U.S. Dealer Network
                            </span>
                            <h1 className="text-3xl md:text-5xl font-extrabold tracking-tight mb-4">
                                Buy & Sell Heavy Ag Machinery Nationwide
                            </h1>
                            <p className="text-slate-200 max-w-2xl mx-auto text-sm md:text-base mb-6">
                                Transparent listings, verified inspector reports, instant ZIP-to-ZIP heavy freight estimation, and escrow-protected transactions.
                            </p>

                            {/* Search Box */}
                            <div className="bg-white p-2 rounded-2xl shadow-xl max-w-3xl mx-auto flex flex-col sm:flex-row gap-2 text-slate-800">
                                <div className="flex-grow flex items-center px-3 border-r border-slate-200">
                                    <i className="fa-solid fa-magnifying-glass text-slate-400 mr-2"></i>
                                    <input 
                                        type="text" 
                                        placeholder="Search John Deere, Case IH, Combines, Planters..." 
                                        className="w-full py-2 text-sm focus:outline-none"
                                        value={searchQuery}
                                        onChange={(e) => setSearchQuery(e.target.value)}
                                    />

        // 3. FREIGHT CALCULATOR VIEW
        function FreightCalculatorView({ listings }) {
            const [originZip, setOriginZip] = useState('50301');
            const [destZip, setDestZip] = useState('68502');
            const [weightLbs, setWeightLbs] = useState(32000);
            const [calculated, setCalculated] = useState(null);

            const handleCalculate = (e) => {
                e.preventDefault();
                const o = parseInt(originZip) || 50000;
                const d = parseInt(destZip) || 60000;
                const estMiles = Math.abs(o - d) % 1200 + 150;
                const ratePerMile = weightLbs > 40000 ? 4.5 : 3.2;
                const baseFreight = estMiles * ratePerMile;
                const permitFees = weightLbs > 35000 ? 250 : 0;
                const total = baseFreight + permitFees;

                setCalculated({
                    miles: estMiles,
                    baseFreight,
                    permitFees,
                    total: Math.round(total)
                });
            };

            return (
                <div className="max-w-4xl mx-auto px-4 py-8">
                    <div className="text-center mb-8">

                                    <div>
                                        <label className="block text-xs font-semibold text-slate-700 mb-1">Origin ZIP</label>
                                        <input 
                                            type="text" 
                                            className="w-full border border-slate-300 rounded-lg p-2.5 text-sm"
                                            value={originZip}
                                            onChange={e => setOriginZip(e.target.value)}
                                        />
                                    </div>
                                    <div>
                                        <label className="block text-xs font-semibold text-slate-700 mb-1">Destination ZIP</label>
                                        <input 
                                            type="text" 
                                            className="w-full border border-slate-300 rounded-lg p-2.5 text-sm"
                                            value={destZip}
                                            onChange={e => setDestZip(e.target.value)}
                                        />
                                    </div>
                                </div>
                                <div>
                                    <label className="block text-xs font-semibold text-slate-700 mb-1">Estimated Equipment Weight (Lbs)</label>
                                    <input 
                                        type="number" 
                                        step="1000"
                                        className="w-full border border-slate-300 rounded-lg p-2.5 text-sm"
                                        value={weightLbs}
                                        onChange={e => setWeightLbs(Number(e.target.value))}
                                    />
                                    <span className="text-[10px] text-slate-400 mt-1 block">Standard tractor: ~25,000 lbs | Combine: ~40,000+ lbs</span>
                                </div>

                                <button type="submit" className="w-full bg-slate-900 hover:bg-slate-800 text-white font-bold py-3 rounded-xl text-sm transition flex items-center justify-center space-x-2">
                                    <i className="fa-solid fa-calculator text-agri-400"></i>
                                    <span>Calculate Freight Estimate</span>
                                </button>
                            </form>
                        </div>

                        {/* Result */}
                        <div className="bg-slate-900 text-white p-6 rounded-2xl flex flex-col justify-between shadow-lg">
                            {calculated ? (
                                <div>
                                    <span className="text-agri-400 text-xs font-bold uppercase tracking-wider">Estimate Breakdown</span>
                                    <div className="text-3xl font-extrabold mt-2 text-white">

                                    </div>

                                    <div className="mt-6 space-y-3 border-t border-slate-800 pt-4 text-xs">

                                        </div>
                                        <div className="flex justify-between">
                                            <span className="text-slate-400">Oversize Permits & Escort</span>
                                            <span className="font-semibold">${calculated.permitFees.toFixed(2)}</span>
                                        </div>
                                        <div className="flex justify-between text-agri-400 font-bold pt-2 border-t border-slate-800">
                                            <span>AgriUS Transport Guarantee</span>
                                            <span>Included</span>
                                        </div>
                                    </div>
                                </div>
                            ) : (
                                <div className="h-full flex flex-col items-center justify-center text-center p-6 text-slate-400">
                                    <i className="fa-solid fa-truck-trailer text-4xl mb-3 text-slate-700"></i>

                    <div className="bg-slate-900 rounded-2xl p-6 text-white mb-8 flex flex-col md:flex-row justify-between items-start md:items-center gap-4 border-l-4 border-amberGold">
                        <div>
                            <div className="flex items-center space-x-2">
                                <span className="bg-amber-500/20 text-amber-400 text-xs font-mono font-bold px-2.5 py-0.5 rounded border border-amber-500/30">
                                    ADMIN SUPERUSER MODE
                                </span>
                                <span className="text-slate-400 text-xs">Full CRUD & Platform Control</span>
                            </div>

                        <div className="bg-white p-5 rounded-2xl border border-amber-200 bg-amber-50/50 shadow-sm">
                            <span className="text-xs text-amber-800 font-medium">Pending Moderation</span>
                            <div className="text-2xl font-black text-amber-900 mt-1">
                                {listings.filter(l => l.status === 'pending').length}

                        </div>
                        <div className="bg-white p-5 rounded-2xl border border-slate-200 shadow-sm">
                            <span className="text-xs text-slate-500 font-medium">Active RFQs</span>

                        </div>
                        <div className="bg-white p-5 rounded-2xl border border-slate-200 shadow-sm">
                            <span className="text-xs text-slate-500 font-medium">Cloud Sync Status</span>
                            <div className="text-xs font-bold text-agri-600 mt-2 flex items-center">
                                <span className="w-2 h-2 bg-agri-500 rounded-full mr-2 animate-pulse"></span> Local Storage Active
                            </div>
                        </div>
                    </div>

                    {/* Listings Management Table */}
                    <div className="bg-white rounded-2xl border border-slate-200 overflow-hidden shadow-sm">

                                {['all', 'pending', 'approved'].map(f => (

                                        key={f}

                                    >
                                        {f}
                                    </button>
                                ))}
                            </div>
                        </div>

                        <div className="overflow-x-auto">
                            <table className="w-full text-left border-collapse text-xs">
                                <thead>
                                    <tr className="border-b border-slate-200 bg-slate-100 text-slate-500 uppercase font-semibold">

                                        <th className="p-3">Category</th>
                                        <th className="p-3">Price</th>
                                        <th className="p-3">Seller</th>
                                        <th className="p-3">Status</th>
                                        <th className="p-3 text-right">Actions</th>
                                    </tr>
                                </thead>
                                <tbody className="divide-y divide-slate-100">
                                    {filteredListings.map(item => (
                                        <tr key={item.id} className="hover:bg-slate-50">
                                            <td className="p-3 font-medium text-slate-900 flex items-center space-x-3">
                                                <img src={item.image} className="w-10 h-10 object-cover rounded-lg" />

            const [method, setMethod] = useState('card'); // card, escrow, ach
            const [loading, setLoading] = useState(false);
            const [cardDetails, setCardDetails] = useState({ number: '4242 •••• •••• 4242', exp: '12/28', cvv: '888' });

            const amount = context.type === 'subscription' ? context.plan.price : context.item.price;

            const handleSubmit = (e) => {
                e.preventDefault();
                setLoading(true);
                setTimeout(() => {
                    setLoading(false);
                    onSuccess();
                }, 1800);
            };

            return (
                <div className="fixed inset-0 z-50 bg-slate-900/70 backdrop-blur-md flex items-center justify-center p-4">
                    <div className="bg-white rounded-3xl max-w-lg w-full overflow-hidden shadow-2xl border border-slate-200">
                        <div className="bg-slate-900 text-white p-6 flex justify-between items-center">

                                <span className="text-agri-400 text-xs font-bold uppercase tracking-wider">AgriUS Payment Gateway</span>
                                <h3 className="text-lg font-extrabold mt-0.5">
                                    {context.type === 'subscription' ? `Subscribe: ${context.plan.name}` : `Escrow Checkout: ${context.item.title}`}
                                </h3>
                            </div>
                            <button onClick={onClose} className="text-slate-400 hover:text-white">
                                <i className="fa-solid fa-xmark text-xl"></i>
                            </button>
                        </div>

                        <div className="p-6">
                            <div className="bg-slate-50 rounded-2xl p-4 border border-slate-200 flex justify-between items-center mb-6">

                                <span className="text-2xl font-black text-slate-900">${amount.toLocaleString()}</span>
                            </div>

                            {/* Payment Options */}
                            <div className="grid grid-cols-3 gap-2 mb-6">
                                {[
                                    { id: 'card', label: 'Credit Card', icon: 'fa-credit-card' },
                                    { id: 'escrow', label: 'Agri Escrow', icon: 'fa-shield-halved' },
                                    { id: 'ach', label: 'ACH Wire', icon: 'fa-building-columns' }

                                    <button
                                        key={m.id}
                                        type="button"
                                        onClick={() => setMethod(m.id)}
                                        className={`p-3 rounded-xl border text-xs font-bold flex flex-col items-center space-y-1 transition ${
                                            method === m.id ? 'border-agri-600 bg-agri-50 text-agri-800' : 'border-slate-200 text-slate-600 hover:bg-slate-50'
                                        }`}
                                    >
                                        <i className={`fa-solid ${m.icon} text-base`}></i>
                                        <span>{m.label}</span>
                                    </button>
                                ))}
                            </div>

                            <form onSubmit={handleSubmit} className="space-y-4">
                                {method === 'card' && (
                                    <>
                                        <div>
                                            <label className="block text-xs font-semibold text-slate-700 mb-1">Card Number</label>
                                            <input 
                                                type="text" 
                                                required 
                                                className="w-full border border-slate-300 rounded-lg p-2.5 text-sm font-mono"
                                                value={cardDetails.number}
                                                onChange={e => setCardDetails({...cardDetails, number: e.target.value})}
                                            />
                                        </div>
                                        <div className="grid grid-cols-2 gap-3">
                                            <div>
                                                <label className="block text-xs font-semibold text-slate-700 mb-1">Expires</label>
                                                <input 
                                                    type="text" 
                                                    required 
                                                    className="w-full border border-slate-300 rounded-lg p-2.5 text-sm font-mono"
                                                    value={cardDetails.exp}
                                                    onChange={e => setCardDetails({...cardDetails, exp: e.target.value})}
                                                />
                                            </div>
                                            <div>
                                                <label className="block text-xs font-semibold text-slate-700 mb-1">CVC / CVV</label>
                                                <input 
                                                    type="text" 
                                                    required 
                                                    className="w-full border border-slate-300 rounded-lg p-2.5 text-sm font-mono"
                                                    value={cardDetails.cvv}
                                                    onChange={e => setCardDetails({...cardDetails, cvv: e.target.value})}
                                                />
                                            </div>
                                        </div>
                                    </>
                                )}

                                {method === 'escrow' && (
                                    <div className="bg-amber-50 p-4 rounded-xl border border-amber-200 text-xs text-amber-900 leading-relaxed">
                                        <i className="fa-solid fa-lock text-amber-600 mr-1.5"></i>
                                        <strong>AgriUS Trade Escrow:</strong> Your funds are held securely in a U.S. FDIC-insured trust account and will only be released to the seller after equipment delivery inspection.
                                    </div>
                                )}

                                {method === 'ach' && (
                                    <div className="bg-blue-50 p-4 rounded-xl border border-blue-200 text-xs text-blue-900 leading-relaxed font-mono">
                                        Bank: First National Ag Bank<br/>
                                        Routing: 121000358<br/>
                                        Account: 8839019284<br/>
                                        Reference: {context.type.toUpperCase()}-{Math.floor(1000+Math.random()*9000)}
                                    </div>
                                )}

                                <button 
                                    type="submit" 
                                    disabled={loading}
                                    className="w-full bg-agri-600 hover:bg-agri-700 text-white font-extrabold py-3.5 rounded-xl text-sm transition shadow-lg flex items-center justify-center space-x-2"
                                >
                                    {loading ? (
                                        <>
                                            <i className="fa-solid fa-circle-notch fa-spin"></i>
                                            <span>Processing Secured Payment...</span>
                                        </>
                                    ) : (
                                        <span>Confirm & Pay ${amount.toLocaleString()}</span>
                                    )}
                                </button>
                            </form>
                        </div>
                    </div>
                </div>
            );
        }

        // 2. ITEM DETAIL MODAL
        function ItemDetailModal({ item, onClose, onBuyNow, onCalculateFreight }) {
            return (
                <div className="fixed inset-0 z-50 bg-slate-900/60 backdrop-blur-sm flex items-center justify-center p-4 overflow-y-auto">
                    <div className="bg-white rounded-3xl max-w-2xl w-full overflow-hidden shadow-2xl border border-slate-200 my-8">

                                    <span className="font-bold text-slate-800">{item.hours ? `${item.hours} hrs` : 'N/A'}</span>

                                <button 
                                    onClick={onCalculateFreight}
                                    className="bg-slate-100 hover:bg-slate-200 text-slate-800 font-bold px-4 py-3 rounded-xl text-sm transition"
                                >
                                    Freight Rates
                                </button>
                            </div>
                        </div>
                    </div>
                </div>
            );
        }

                title: '',
                category: 'Tractors',
                price: '',
                location: 'Des Moines, IA',
                zip: '50301',
                hours: '',
                hp: '',
                condition: 'Excellent',
                description: '',
                image: 'https://images.unsplash.com/photo-1592982537447-7440770cbfc9?auto=format&fit=crop&w=800&q=80'

            const handleSubmit = (e) => {
                e.preventDefault();
                onSubmit({
                    ...formData,
                    price: Number(formData.price),
                    hours: Number(formData.hours),
                    hp: Number(formData.hp)
                });

            return (
                <div className="fixed inset-0 z-50 bg-slate-900/60 backdrop-blur-sm flex items-center justify-center p-4">
                    <div className="bg-white rounded-3xl max-w-lg w-full p-6 shadow-2xl border border-slate-200 max-h-[90vh] overflow-y-auto">

                            <div className="grid grid-cols-2 gap-3">

                                    <label className="block font-semibold text-slate-700 mb-1">Category</label>

                                </div>
                                <div>
                                    <label className="block font-semibold text-slate-700 mb-1">Price ($USD)</label>

                                        type="number" 
                                        required 
                                        placeholder="150000"
                                        className="w-full border border-slate-300 rounded-lg p-2.5 text-sm"
                                        value={formData.price}
                                        onChange={e => setFormData({...formData, price: e.target.value})}

                                    <label className="block font-semibold text-slate-700 mb-1">Location City, State</label>
                                    <input 
                                        type="text" 
                                        required 
                                        placeholder="Fargo, ND"
                                        className="w-full border border-slate-300 rounded-lg p-2.5 text-sm"
                                        value={formData.location}
                                        onChange={e => setFormData({...formData, location: e.target.value})}
                                    />
                                </div>
                                <div>
                                    <label className="block font-semibold text-slate-700 mb-1">ZIP Code</label>
                                    <input 
                                        type="text" 
                                        required 
                                        placeholder="58102"
                                        className="w-full border border-slate-300 rounded-lg p-2.5 text-sm"
                                        value={formData.zip}
                                        onChange={e => setFormData({...formData, zip: e.target.value})}
                                    />
                                </div>
                            </div>

                            <div>
                                <label className="block font-semibold text-slate-700 mb-1">Description</label>
                                <textarea 
                                    rows="3" 
                                    className="w-full border border-slate-300 rounded-lg p-2.5 text-sm"

                            <button type="submit" className="w-full bg-agri-600 hover:bg-agri-700 text-white font-bold py-3 rounded-xl text-sm transition">
                                Save & Submit Listing
                            </button>
                        </form>
                    </div>
                </div>
            );
        }

            const [url, setUrl] = useState('');

            return (
                <div className="fixed inset-0 z-50 bg-slate-900/70 backdrop-blur-md flex items-center justify-center p-4">
                    <div className="bg-white rounded-3xl max-w-md w-full p-6 shadow-2xl border border-slate-200">
                        <div className="flex justify-between items-center mb-4">
                            <div className="flex items-center space-x-2">
                                <i className="fa-solid fa-database text-emerald-600 text-lg"></i>
                                <h3 className="font-bold text-slate-900 text-base">Supabase Cloud Database Config</h3>

                        <div className="space-y-3 text-xs mb-6">
                            <div>
                                <label className="block font-semibold text-slate-700 mb-1">Supabase Project URL</label>
                                <input 
                                    type="text"

                        </div>

                        <button 
                            onClick={() => { alert("Supabase configuration saved! (In live mode, cloud tables will connect)"); onClose(); }}
                            className="w-full bg-emerald-600 hover:bg-emerald-700 text-white font-bold py-3 rounded-xl text-xs transition"
                        >
                            Save Cloud Connection Keys
                        </button>
                    </div>
                </div>
            );
        }

        // Render Application
        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
