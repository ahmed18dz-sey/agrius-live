<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AgriUS Marketplace - Complete US Agricultural & Logistics Ecosystem</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- React & ReactDOM CDN -->
    <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <!-- Babel for JSX -->
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <!-- FontAwesome Icons for visual polish -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body class="bg-slate-50 text-slate-800 font-sans antialiased selection:bg-emerald-500 selection:text-white">
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect } = React;

        function AgriUSApp() {
            // Navigation & Tabs
            const [activeTab, setActiveTab] = useState('home');
            const [selectedCategory, setSelectedCategory] = useState('All');
            const [searchQuery, setSearchQuery] = useState('');
            const [currency, setCurrency] = useState('USD');
            const [exchangeRates] = useState({ USD: 1, EUR: 0.92, SAR: 3.75, AED: 3.67, DZD: 134.5 });

            // User & Auth State
            const [currentUser, setCurrentUser] = useState({
                name: "John Miller",
                email: "john@midwestfarm.com",
                type: "Verified Dealer", // Buyer, Verified Dealer, Freight Carrier
                company: "Midwest Ag Solutions",
                fein: "XX-XXX4829",
                verified: true,
                subscription: "Commercial Dealer", // Free Farmer, Commercial Dealer, Enterprise
                freeListingsLeft: 3
            });
            const [isAuthModalOpen, setIsAuthModalOpen] = useState(false);
            const [authMode, setAuthMode] = useState('login'); // login or register
            const [regForm, setRegForm] = useState({ name: '', email: '', type: 'Verified Dealer', company: '', fein: '' });

            // Cart & Trade Assurance Checkout State
            const [cart, setCart] = useState([]);
            const [isCartModalOpen, setIsCartModalOpen] = useState(false);
            const [buyerZip, setBuyerZip] = useState('');
            const [checkoutFreight, setCheckoutFreight] = useState(0);

            // Logistics State
            const [originZip, setOriginZip] = useState('50309');
            const [destZip, setDestZip] = useState('75201');
            const [weightClass, setWeightClass] = useState('flatbed'); // ltl, flatbed, oversize
            const [freightQuote, setFreightQuote] = useState(null);

            // RFQ Board State
            const [isRfqModalOpen, setIsRfqModalOpen] = useState(false);
            const [rfqList, setRfqList] = useState([
                { id: 101, buyer: "Dakota Grain Co.", item: "100 Tons Bulk Urea NPK 46-0-0 Fertilizer", zip: "58102", budget: "$45,000", bids: 4, date: "2 hours ago" },
                { id: 102, buyer: "Sunrise Ranch LLC", item: "Fleet of 3x Row-Crop Tractors (300+ HP)", zip: "79101", budget: "$750,000", bids: 7, date: "5 hours ago" },
                { id: 103, buyer: "Green Valley Organics", item: "Solar Irrigation Pivot System (1/2 Mile Coverage)", zip: "93701", budget: "$110,000", bids: 2, date: "1 day ago" }
            ]);
            const [newRfq, setNewRfq] = useState({ item: '', zip: '', budget: '', company: '' });

            // Equipment Catalog State
            const [equipmentList, setEquipmentList] = useState([
                { id: 1, category: "Heavy Machinery", title: "John Deere 8R 370 Row-Crop Tractor", price: 285000, location: "Des Moines, IA (ZIP: 50309)", weight: "24,500 lbs", image: "https://images.unsplash.com/photo-1592417817098-8f3d6eb26978?auto=format&fit=crop&w=800&q=80", seller: "Midwest Farm Solutions", verified: true },
                { id: 2, category: "Precision Ag", title: "DJI Agras T40 Agricultural Spraying Drone Kit", price: 22500, location: "Fresno, CA (ZIP: 93701)", weight: "140 lbs", image: "https://images.unsplash.com/photo-1508614589041-895b88991e3e?auto=format&fit=crop&w=800&q=80", seller: "AgriTech Innovations", verified: true },
                { id: 3, category: "Irrigation & Solar", title: "Valmont Center Pivot Solar Irrigation Array", price: 54000, location: "Dallas, TX (ZIP: 75201)", weight: "8,200 lbs", image: "https://images.unsplash.com/photo-1563514227147-6d2ff665a6a0?auto=format&fit=crop&w=800&q=80", seller: "Texas Hydro Systems", verified: true },
                { id: 4, category: "Seeds & Bulk Inputs", title: "Certified Hybrid Corn Seeds (Bulk 50-Ton Pallets)", price: 18500, location: "Peoria, IL (ZIP: 61601)", weight: "3,500 lbs", image: "https://images.unsplash.com/photo-1530836369250-ef72a3f5cda8?auto=format&fit=crop&w=800&q=80", seller: "Heartland Seeds Co.", verified: false },
                { id: 5, category: "Livestock & Barn", title: "Automated Commercial Livestock Feeding Silos", price: 32000, location: "Omaha, NE (ZIP: 68102)", weight: "6,100 lbs", image: "https://images.unsplash.com/photo-1500937386664-56d1dfef3854?auto=format&fit=crop&w=800&q=80", seller: "Nebraska AgriBarn", verified: true },
                { id: 6, category: "Heavy Machinery", title: "Case IH Axial-Flow 8250 Combine Harvester", price: 310000, location: "Fargo, ND (ZIP: 58102)", weight: "38,000 lbs", image: "https://images.unsplash.com/photo-1589923188653-ba6fc58dcf48?auto=format&fit=crop&w=800&q=80", seller: "Dakota Heavy Equipment", verified: true }
            ]);

            // Add Listing State
            const [isAddListingOpen, setIsAddListingOpen] = useState(false);
            const [newListing, setNewListing] = useState({ title: '', category: 'Heavy Machinery', price: '', location: '', weight: '' });

            // Currency Helper
            const formatCurrency = (usdVal) => {
                const rate = exchangeRates[currency] || 1;
                const converted = usdVal * rate;
                const symbol = currency === 'USD' ? '$' : currency === 'EUR' ? '€' : currency === 'SAR' ? 'SAR ' : currency === 'AED' ? 'AED ' : 'DZD ';
                return `${symbol}${converted.toLocaleString(undefined, { maximumFractionDigits: 0 })}`;
            };

            // Calculate Freight Demo
            const runFreightCalc = () => {
                if (!originZip || !destZip) { alert("Please enter both Origin and Destination ZIP codes."); return; }
                const dist = Math.abs(parseInt(originZip) - parseInt(destZip)) % 800 + 250;
                let multiplier = weightClass === 'ltl' ? 1.2 : weightClass === 'flatbed' ? 2.8 : 4.5;
                const estCost = Math.round(dist * multiplier);
                setFreightQuote({ distance: dist, cost: estCost, carrier: dist > 500 ? "FedEx Freight / Heavy Haul" : "uShip Commercial Logistics" });
            };

            // Handle Add Listing
            const handleAddListingSubmit = (e) => {
                e.preventDefault();
                if (!newListing.title || !newListing.price) return;
                const item = {
                    id: Date.now(),
                    ...newListing,
                    price: Number(newListing.price),
                    seller: currentUser.company || currentUser.name,
                    verified: currentUser.verified,
                    image: "https://images.unsplash.com/photo-1589923188653-ba6fc58dcf48?auto=format&fit=crop&w=800&q=80"
                };
                setEquipmentList([item, ...equipmentList]);
                setIsAddListingOpen(false);
                setNewListing({ title: '', category: 'Heavy Machinery', price: '', location: '', weight: '' });
                alert("Equipment listing published successfully under your verified seller account!");
            };

            // Handle RFQ Submit
            const handleRfqSubmit = (e) => {
                e.preventDefault();
                if (!newRfq.item || !newRfq.budget) return;
                const rfq = {
                    id: Date.now(),
                    buyer: newRfq.company || currentUser.company,
                    item: newRfq.item,
                    zip: newRfq.zip || "US Wide",
                    budget: `$${Number(newRfq.budget).toLocaleString()}`,
                    bids: 0,
                    date: "Just now"
                };
                setRfqList([rfq, ...rfqList]);
                setIsRfqModalOpen(false);
                setNewRfq({ item: '', zip: '', budget: '', company: '' });
                alert("RFQ Broadcasted to over 1,200 verified US dealers and manufacturers!");
            };

            const filteredEquipment = equipmentList.filter(item => {
                const matchesCat = selectedCategory === 'All' || item.category === selectedCategory;
                const matchesSearch = item.title.toLowerCase().includes(searchQuery.toLowerCase()) || item.location.toLowerCase().includes(searchQuery.toLowerCase());
                return matchesCat && matchesSearch;
            });

            return (
                <div className="min-h-screen flex flex-col justify-between">
                    <div>
                        {/* 1. TOP TRUST BANNER & CURRENCY TOGGLE */}
                        <div className="bg-emerald-950 text-emerald-100 text-xs py-2 px-4 border-b border-emerald-900">
                            <div className="max-w-7xl mx-auto flex flex-col sm:flex-row justify-between items-center gap-2">
                                <div className="flex items-center gap-3">
                                    <span className="bg-emerald-800 text-emerald-200 text-[10px] font-bold px-2 py-0.5 rounded-full uppercase tracking-wider">
                                        <i className="fa-solid fa-shield-halved mr-1"></i> Verified US Network
                                    </span>
                                    <span>AgriUS Trade Assurance: <strong>10% Escrow Deposit + Pay on Delivery</strong></span>
                                </div>
                                <div className="flex items-center gap-4">
                                    <span className="hidden md:inline text-emerald-300"><i className="fa-solid fa-truck-fast mr-1"></i> Heavy Freight API Connected</span>
                                    <div className="flex items-center gap-1 bg-emerald-900/80 px-2 py-0.5 rounded border border-emerald-800">
                                        <i className="fa-solid fa-globe text-emerald-400"></i>
                                        <select 
                                            value={currency} 
                                            onChange={(e) => setCurrency(e.target.value)}
                                            className="bg-transparent text-white font-bold cursor-pointer outline-none text-xs"
                                        >
                                            <option value="USD" className="bg-slate-900">USD ($)</option>
                                            <option value="EUR" className="bg-slate-900">EUR (€)</option>
                                            <option value="SAR" className="bg-slate-900">SAR (ر.س)</option>
                                            <option value="AED" className="bg-slate-900">AED (د.إ)</option>
                                            <option value="DZD" className="bg-slate-900">DZD (دج)</option>
                                        </select>
                                    </div>
                                </div>
                            </div>
                        </div>

                        {/* 2. STICKY HEADER & NAVBAR */}
                        <header className="bg-white border-b border-slate-200 sticky top-0 z-40 shadow-sm">
                            <div className="max-w-7xl mx-auto px-4 py-3.5 flex items-center justify-between gap-4">
                                {/* Logo */}
                                <div className="flex items-center gap-2.5 cursor-pointer" onClick={() => setActiveTab('home')}>
                                    <div className="bg-gradient-to-br from-emerald-600 to-emerald-800 text-white p-2.5 rounded-xl shadow-md flex items-center justify-center">
                                        <i className="fa-solid fa-tractor text-xl"></i>
                                    </div>
                                    <div>
                                        <h1 className="text-xl font-black tracking-tight text-emerald-950">AgriUS<span className="text-amber-600">Market</span></h1>
                                        <p className="text-[10px] text-slate-500 font-semibold uppercase tracking-widest">US Agricultural & Freight Hub</p>
                                    </div>
                                </div>

                                {/* Desktop Navigation */}
                                <nav className="hidden lg:flex items-center gap-6 font-semibold text-sm text-slate-700">
                                    <button onClick={() => setActiveTab('home')} className={`hover:text-emerald-600 transition ${activeTab === 'home' ? 'text-emerald-600 font-bold border-b-2 border-emerald-600 pb-1' : ''}`}>Home</button>
                                    <button onClick={() => setActiveTab('market')} className={`hover:text-emerald-600 transition ${activeTab === 'market' ? 'text-emerald-600 font-bold border-b-2 border-emerald-600 pb-1' : ''}`}>Machinery & Supplies</button>
                                    <button onClick={() => setActiveTab('logistics')} className={`hover:text-emerald-600 transition ${activeTab === 'logistics' ? 'text-emerald-600 font-bold border-b-2 border-emerald-600 pb-1' : ''}`}>Heavy Freight</button>
                                    <button onClick={() => setActiveTab('subscriptions')} className={`hover:text-emerald-600 transition ${activeTab === 'subscriptions' ? 'text-emerald-600 font-bold border-b-2 border-emerald-600 pb-1' : ''}`}>Plans & Pricing</button>
                                    <button onClick={() => setActiveTab('rfq')} className={`hover:text-emerald-600 transition ${activeTab === 'rfq' ? 'text-emerald-600 font-bold border-b-2 border-emerald-600 pb-1' : ''}`}>
                                        RFQ Board <span className="bg-amber-100 text-amber-800 text-[10px] px-1.5 py-0.5 rounded-full ml-1">Live</span>
                                    </button>
                                </nav>

                                {/* Action Buttons */}
                                <div className="flex items-center gap-3">
                                    {/* Cart */}
                                    <button 
                                        onClick={() => setIsCartModalOpen(true)}
                                        className="relative bg-slate-100 hover:bg-slate-200 p-2.5 rounded-xl transition text-slate-700"
                                        title="Shopping Cart"
                                    >
                                        <i className="fa-solid fa-cart-shopping text-base"></i>
                                        {cart.length > 0 && (
                                            <span className="absolute -top-1.5 -right-1.5 bg-amber-500 text-white text-[11px] font-black w-5 h-5 rounded-full flex items-center justify-center shadow-sm">
                                                {cart.length}
                                            </span>
                                        )}
                                    </button>

                                    {/* Account Portal Button */}
                                    <button 
                                        onClick={() => setActiveTab('account')}
                                        className={`flex items-center gap-2 px-3.5 py-2 rounded-xl text-xs font-bold transition ${activeTab === 'account' ? 'bg-emerald-700 text-white' : 'bg-slate-100 hover:bg-slate-200 text-slate-800'}`}
                                    >
                                        <i className="fa-solid fa-circle-user text-emerald-600"></i>
                                        <span className="hidden sm:inline">{currentUser.name.split(' ')[0]} ({currentUser.subscription})</span>
                                    </button>

                                    {/* List Equipment CTA */}
                                    <button 
                                        onClick={() => setIsAddListingOpen(true)}
                                        className="bg-emerald-600 hover:bg-emerald-700 text-white text-xs font-bold px-3.5 py-2 rounded-xl shadow-sm transition flex items-center gap-1.5"
                                    >
                                        <i className="fa-solid fa-plus"></i>
                                        <span className="hidden sm:inline">List Equipment</span>
                                    </button>
                                </div>
                            </div>
                        </header>

                        {/* MAIN CONTENT ROUTER */}
                        <main className="max-w-7xl mx-auto px-4 py-8">

                            {/* TAB 1: HOME PAGE */}
                            {activeTab === 'home' && (
                                <div className="space-y-12">
                                    {/* Hero Banner */}
                                    <div className="relative rounded-3xl overflow-hidden bg-gradient-to-r from-emerald-950 via-emerald-900 to-slate-900 text-white p-8 md:p-16 shadow-2xl space-y-6 border border-emerald-800/40">
                                        <div className="max-w-3xl space-y-4">
                                            <div className="inline-flex items-center gap-2 bg-amber-500/20 border border-amber-500/40 text-amber-300 text-xs font-bold px-3 py-1 rounded-full uppercase tracking-wider">
                                                <i className="fa-solid fa-award"></i> The Premiere US Agricultural B2B & B2C Marketplace
                                            </div>
                                            <h2 className="text-3xl sm:text-5xl font-black leading-tight tracking-tight">
                                                Buy & Sell Heavy Farm Machinery, Bulk Inputs & Freight
                                            </h2>
                                            <p className="text-slate-300 text-sm sm:text-base leading-relaxed">
                                                Connect directly with verified US farm dealers, manufacturers, and heavy logistics carriers. Trade with full peace of mind using our **10% Escrow Deposit & Pay on Delivery** Trade Assurance.
                                            </p>
                                            <div className="flex flex-wrap gap-4 pt-2">
                                                <button onClick={() => setActiveTab('market')} className="bg-emerald-500 hover:bg-emerald-600 text-slate-950 font-black px-6 py-3.5 rounded-xl shadow-lg transition flex items-center gap-2">
                                                    Browse Machinery Store <i className="fa-solid fa-arrow-right"></i>
                                                </button>
                                                <button onClick={() => setIsRfqModalOpen(true)} className="bg-white/10 hover:bg-white/20 border border-white/30 text-white font-bold px-6 py-3.5 rounded-xl transition">
                                                    Submit Bulk RFQ
                                                </button>
                                            </div>
                                        </div>
                                    </div>

                                    {/* Categories Overview */}
                                    <div className="space-y-4">
                                        <div className="flex justify-between items-end">
                                            <div>
                                                <h3 className="text-xl font-extrabold text-slate-900">Explore Agricultural Categories</h3>
                                                <p className="text-xs text-slate-500">Comprehensive equipment, inputs, and technology for modern farms.</p>
                                            </div>
                                            <button onClick={() => setActiveTab('market')} className="text-xs font-bold text-emerald-600 hover:underline">View All Category Products ➡️</button>
                                        </div>

                                        <div className="grid grid-cols-2 md:grid-cols-5 gap-4">
                                            {[
                                                { title: "Heavy Machinery", icon: "fa-tractor", count: "1,240+ Units", cat: "Heavy Machinery" },
                                                { title: "Precision Ag & Drones", icon: "fa-drone", count: "320+ Systems", cat: "Precision Ag" },
                                                { title: "Irrigation & Solar", icon: "fa-faucet-drip", count: "580+ Kits", cat: "Irrigation & Solar" },
                                                { title: "Seeds & Bulk Inputs", icon: "fa-seedling", count: "2,100+ Tons", cat: "Seeds & Bulk Inputs" },
                                                { title: "Livestock & Barn", icon: "fa-warehouse", count: "890+ Products", cat: "Livestock & Barn" }
                                            ].map((c, i) => (
                                                <div 
                                                    key={i} 
                                                    onClick={() => { setSelectedCategory(c.cat); setActiveTab('market'); }}
                                                    className="bg-white p-5 rounded-2xl border border-slate-200 hover:border-emerald-500 hover:shadow-md transition cursor-pointer text-center space-y-2 group"
                                                >
                                                    <div className="w-12 h-12 bg-emerald-50 text-emerald-600 rounded-xl flex items-center justify-center mx-auto text-xl group-hover:bg-emerald-600 group-hover:text-white transition">
                                                        <i className={`fa-solid ${c.icon}`}></i>
                                                    </div>
                                                    <h4 className="font-bold text-slate-900 text-sm">{c.title}</h4>
                                                    <p className="text-[11px] text-slate-400 font-medium">{c.count}</p>
                                                </div>
                                            ))}
                                        </div>
                                    </div>

                                    {/* Value Pillars */}
                                    <div className="grid grid-cols-1 md:grid-cols-3 gap-6">
                                        <div className="bg-white p-6 rounded-2xl border border-slate-200 shadow-sm space-y-3">
                                            <div className="w-10 h-10 bg-amber-100 text-amber-700 rounded-xl flex items-center justify-center font-bold text-lg">🛡️</div>
                                            <h4 className="font-bold text-slate-900 text-base">Trade Assurance Escrow</h4>
                                            <p className="text-xs text-slate-500 leading-relaxed">Pay a small 10% deposit online into secure escrow. Inspect your machinery on your farm before releasing the 90% balance.</p>
                                        </div>
                                        <div className="bg-white p-6 rounded-2xl border border-slate-200 shadow-sm space-y-3">
                                            <div className="w-10 h-10 bg-emerald-100 text-emerald-700 rounded-xl flex items-center justify-center font-bold text-lg">🚛</div>
                                            <h4 className="font-bold text-slate-900 text-base">ZIP-to-ZIP Heavy Logistics</h4>
                                            <p className="text-xs text-slate-500 leading-relaxed">Instant automated shipping calculation for flatbed trailers, LTL freight, and oversized machinery across all US states.</p>
                                        </div>
                                        <div className="bg-white p-6 rounded-2xl border border-slate-200 shadow-sm space-y-3">
                                            <div className="w-10 h-10 bg-blue-100 text-blue-700 rounded-xl flex items-center justify-center font-bold text-lg">✅</div>
                                            <h4 className="font-bold text-slate-900 text-base">FEIN & Tax ID Verification</h4>
                                            <p className="text-xs text-slate-500 leading-relaxed">Sellers and dealers undergo rigorous background checks to guarantee certified equipment listings and genuine warranties.</p>
                                        </div>
                                    </div>
                                </div>
                            )}

                            {/* TAB 2: MACHINERY STORE & CATALOG */}
                            {activeTab === 'market' && (
                                <div className="space-y-6">
                                    {/* Filter Header */}
                                    <div className="bg-white p-4 rounded-2xl border border-slate-200 shadow-sm flex flex-col md:flex-row justify-between items-center gap-4">
                                        <div className="relative w-full md:w-96">
                                            <i className="fa-solid fa-magnifying-glass absolute left-3.5 top-3 text-slate-400 text-sm"></i>
                                            <input 
                                                type="text" 
                                                placeholder="Search John Deere, Drones, Solar, Seeds..." 
                                                value={searchQuery}
                                                onChange={(e) => setSearchQuery(e.target.value)}
                                                className="w-full pl-10 pr-4 py-2 border rounded-xl text-sm outline-none focus:border-emerald-500"
                                            />
                                        </div>

                                        {/* Category Tabs */}
                                        <div className="flex gap-2 overflow-x-auto w-full md:w-auto pb-2 md:pb-0 scrollbar-none">
                                            {['All', 'Heavy Machinery', 'Precision Ag', 'Irrigation & Solar', 'Seeds & Bulk Inputs', 'Livestock & Barn'].map((cat) => (
                                                <button 
                                                    key={cat}
                                                    onClick={() => setSelectedCategory(cat)}
                                                    className={`px-3.5 py-1.5 rounded-xl text-xs font-bold whitespace-nowrap transition ${selectedCategory === cat ? 'bg-emerald-700 text-white shadow-sm' : 'bg-slate-100 text-slate-600 hover:bg-slate-200'}`}
                                                >
                                                    {cat}
                                                </button>
                                            ))}
                                        </div>
                                    </div>

                                    {/* Products Grid */}
                                    <div className="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6">
                                        {filteredEquipment.map((item) => (
                                            <div key={item.id} className="bg-white rounded-2xl border border-slate-200 overflow-hidden shadow-sm hover:shadow-md transition flex flex-col justify-between">
                                                <div>
                                                    <div className="relative h-52 bg-slate-100 overflow-hidden">
                                                        <img src={item.image} alt={item.title} className="w-full h-full object-cover" />
                                                        {item.verified && (
                                                            <span className="absolute top-3 left-3 bg-emerald-600 text-white text-[10px] font-extrabold px-2.5 py-1 rounded-full shadow-md flex items-center gap-1">
                                                                <i className="fa-solid fa-circle-check"></i> Verified Dealer
                                                            </span>
                                                        )}
                                                        <span className="absolute bottom-3 right-3 bg-slate-900/90 backdrop-blur-md text-white text-xs font-black px-3 py-1.5 rounded-xl">
                                                            {formatCurrency(item.price)}
                                                        </span>
                                                    </div>

                                                    <div className="p-5 space-y-2">
                                                        <span className="text-[10px] font-black uppercase text-emerald-700 tracking-wider bg-emerald-50 px-2 py-0.5 rounded-md">
                                                            {item.category}
                                                        </span>
                                                        <h3 className="font-bold text-slate-900 text-base leading-snug">{item.title}</h3>
                                                        <div className="space-y-1 text-xs text-slate-500 pt-1">
                                                            <p><i className="fa-solid fa-location-dot text-emerald-600 w-4"></i> {item.location}</p>
                                                            <p><i className="fa-solid fa-weight-hanging text-slate-400 w-4"></i> Weight: <strong>{item.weight}</strong></p>
                                                            <p><i className="fa-solid fa-store text-slate-400 w-4"></i> Seller: {item.seller}</p>
                                                        </div>
                                                    </div>
                                                </div>

                                                <div className="p-5 pt-0">
                                                    <button 
                                                        onClick={() => { setCart([...cart, item]); setIsCartModalOpen(true); }}
                                                        className="w-full bg-slate-900 hover:bg-emerald-600 text-white text-xs font-bold py-3 rounded-xl transition flex items-center justify-center gap-2"
                                                    >
                                                        <i className="fa-solid fa-cart-plus"></i> Buy with 10% Escrow Deposit
                                                    </button>
                                                </div>
                                            </div>
                                        ))}
                                    </div>
                                </div>
                            )}

                            {/* TAB 3: LOGISTICS & HEAVY FREIGHT */}

                                    <button 
                                        onClick={() => { alert("Logged in successfully!"); setIsAuthModalOpen(false); }}
                                        className="w-full bg-emerald-600 text-white font-bold py-3 rounded-xl text-xs"
                                    >
                                        Access Portal
                                    </button>
                                </div>
                            </div>
                        </div>
                    )}

                    {/* FOOTER */}
                    <footer className="bg-slate-950 text-slate-400 text-xs py-8 px-4 border-t border-slate-900 mt-16">
                        <div className="max-w-7xl mx-auto flex flex-col sm:flex-row justify-between items-center gap-4 text-center sm:text-left">
                            <div>
                                <h4 className="text-white font-black text-sm">AgriUS Market Inc.</h4>
                                <p className="text-[11px] text-slate-500">Connecting American Farms, Dealers, and Heavy Haul Freight.</p>
                            </div>
                            <p className="text-[11px]">© 2026 AgriUS Marketplace. All rights reserved. Trade Assurance Escrow Protected.</p>
                        </div>
                    </footer>
                </div>
            );
        }

        ReactDOM.createRoot(document.getElementById('root')).render(<AgriUSApp />);
    </script>
</body>
</html>
