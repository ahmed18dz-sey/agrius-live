<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AgriUS Marketplace | U.S. Premier Ag Machinery, Logistics & Certified Inspections</title>
  
  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>
  
  <!-- React & ReactDOM -->
  <script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>
  
  <!-- Babel Compiler for JSX -->
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  
  <!-- Lucide Icons -->
  <script src="https://unpkg.com/lucide@latest"></script>
  
  <!-- Supabase JS Client -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  
  <!-- Google Model Viewer for 3D & Augmented Reality (AR) -->
  <script type="module" src="https://ajax.googleapis.com/ajax/libs/model-viewer/3.3.0/model-viewer.min.js"></script>

  <style>
    @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap');
    body { font-family: 'Inter', sans-serif; background-color: #f8fafc; }
    model-viewer { width: 100%; height: 320px; background-color: #0f172a; border-radius: 0.75rem; }
  </style>
</head>
<body>

  <div id="root"></div>

  <script type="text/babel">
    const { useState, useEffect } = React;

    const AMAZON_AFFILIATE_TAG = "agrius0f-20";
    const SUPABASE_URL = "https://YOUR_SUPABASE_PROJECT_ID.supabase.co";
    const SUPABASE_ANON_KEY = "YOUR_SUPABASE_ANON_KEY";
    let supabase = null;

    try {
      if (SUPABASE_URL && !SUPABASE_URL.includes("YOUR_SUPABASE")) {
        supabase = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
      }
    } catch (e) {
      console.warn("Supabase initialization deferred.", e);
    }

    // Heavy Equipment Inventory
    const initialEquipment = [
      {
        id: 1,
        title: "John Deere 8R 410 Tractor (2024)",
        category: "Heavy Machinery",
        price: 385000,
        location: "Moline, IL",
        weight: "31,000 lbs",
        seller: "Midwest Agri Fleet",
        vin: "AGRI-8R410-2024-9982",
        healthScore: "98% Excellent",
        approved: true,
        image: "https://images.unsplash.com/photo-1592861956120-e524fc739696?auto=format&fit=crop&w=800&q=80",
        youtubeUrl: "https://www.youtube.com/embed/dQw4w9WgXcQ",
        model3dUrl: "https://modelviewer.dev/shared-assets/models/Astronaut.glb"
      },
      {
        id: 2,
        title: "DJI Agras T40 Spraying Drone System",
        category: "Ag Tech & Drones",
        price: 24500,
        location: "Fresno, CA",
        weight: "85 lbs",
        seller: "Pacific Ag Tech",
        vin: "DRONE-T40-2025-0041",
        healthScore: "100% Like New",
        approved: true,
        image: "https://images.unsplash.com/photo-1508614589041-895b88991e3e?auto=format&fit=crop&w=800&q=80",
        youtubeUrl: "",
        model3dUrl: ""
      }
    ];

    // Amazon Affiliated Hand Tools
    const amazonTools = [
      {
        id: "amz-1",
        title: "Milwaukee M18 Fuel 1/2 High Torque Impact Wrench Kit",
        category: "Heavy Mechanics Tools",
        price: "299.00",
        rating: "4.9 ★ (12,400+ reviews)",
        image: "https://images.unsplash.com/photo-1581092160607-ee22621dd758?auto=format&fit=crop&w=500&q=80",
        amazonUrl: `https://www.amazon.com/dp/B073CR23GF?tag=${AMAZON_AFFILIATE_TAG}`
      },
      {
        id: "amz-2",
        title: "Fiskars Pro 36 Inch Heavy Duty Forging Axe & Cutter",
        category: "Manual Field Tools",
        price: "64.99",
        rating: "4.8 ★ (8,900+ reviews)",
        image: "https://images.unsplash.com/photo-1586864387967-d02ef85d93e8?auto=format&fit=crop&w=500&q=80",
        amazonUrl: `https://www.amazon.com/dp/B00004SD1Y?tag=${AMAZON_AFFILIATE_TAG}`
      }
    ];

    // Carriers / Logistics Network Data
    const initialCarriers = [
      {
        id: "car-1",
        name: "TransAmerica Lowboy Heavy Haul LLC",
        fleet: "45 Lowboy Trailers (Up to 80,000 lbs)",
        coverage: "Nationwide (All 50 U.S. States)",
        insurance: "$5,000,000 Cargo Insured",
        rating: "4.9 ★ (310+ Transports)",
        contact: "dispatch@transamericalowboy.com"
      }
    ];

    // Certified Inspectors Network Data
    const initialInspectors = [
      {
        id: "insp-1",
        name: "Robert 'Bob' Vance, ASE Master Tech",
        company: "AgriUS Certified Field Inspection Unit #104",
        specialty: "Hydraulic Systems, Diesel Powertrains & Frame Integrity",
        rate: "$350 Flat Audit Fee",
        location: "Midwest Region (IL, IA, IN)",
        rating: "5.0 ★ (140+ Audits Completed)",
        phone: "(312) 555-0199",
        image: "https://images.unsplash.com/photo-1560250097-0b93528c311a?auto=format&fit=crop&w=400&q=80"
      }
    ];

    // Mechanics Directory
    const initialMechanics = [
      {
        id: "mech-1",
        name: "Dave 'Diesel' Henderson",
        company: "Midwest Mobile Heavy Repair LLC",
        specialty: "John Deere & Case IH Hydraulics & Engines",
        rate: "$95 / Hour",
        location: "Des Moines, IA (Radius: 150 miles)",
        rating: "4.9 ★ (84 Verified)",
        phone: "(515) 555-0192",
        image: "https://images.unsplash.com/photo-1621905251189-08b45d6a269e?auto=format&fit=crop&w=400&q=80"
      }
    ];

    // Sponsored Rotating Ads Ticker Data
    const initialSponsoredAds = [
      { id: 'ad-1', title: '🌟 SPONSORED DEALER: Midwest Fleet Special Discount - Save $500 on Freight Today!', type: 'Dealer', link: '#' },
      { id: 'ad-2', title: '🚚 FEATURED CARRIER: TransAmerica Lowboy offers 10% off cross-state heavy haul!', type: 'Logistics', link: '#' },
      { id: 'ad-3', title: '🔍 CERTIFIED INSPECTION: Book an on-site 50-point audit within 24 hours!', type: 'Inspection', link: '#' }
    ];

    function App() {
      const [view, setView] = useState('marketplace'); // marketplace, amazonTools, logistics, inspectors, mechanics, freight, admin
      
      const [equipmentList, setEquipmentList] = useState(() => {
        const saved = localStorage.getItem('agrius_equipment');
        return saved ? JSON.parse(saved) : initialEquipment;
      });

      const [carriersList, setCarriersList] = useState(() => {
        const saved = localStorage.getItem('agrius_carriers');
        return saved ? JSON.parse(saved) : initialCarriers;
      });

      const [inspectorsList, setInspectorsList] = useState(() => {
        const saved = localStorage.getItem('agrius_inspectors');
        return saved ? JSON.parse(saved) : initialInspectors;
      });

      const [mechanicsList, setMechanicsList] = useState(() => {
        const saved = localStorage.getItem('agrius_mechanics');
        return saved ? JSON.parse(saved) : initialMechanics;
      });

      const [sponsoredAds, setSponsoredAds] = useState(initialSponsoredAds);
      const [currentAdIndex, setCurrentAdIndex] = useState(0);

      // Modals
      const [showListModal, setShowListModal] = useState(false);
      const [showCarrierModal, setShowCarrierModal] = useState(false);
      const [showInspectorModal, setShowInspectorModal] = useState(false);
      const [showMechanicModal, setShowMechanicModal] = useState(false);
      const [showAdModal, setShowAdModal] = useState(false);
      const [showSubModal, setShowSubModal] = useState(false);
      const [activeLegalModal, setActiveLegalModal] = useState(null); // 'tos', 'privacy', 'escrow', 'inspectorAgreement'
      const [selectedPassport, setSelectedPassport] = useState(null);
      const [adminPassword, setAdminPassword] = useState('');
      const [isAdminAuthenticated, setIsAdminAuthenticated] = useState(false);

      // Chat Drawer State
      const [chatState, setChatState] = useState({ isOpen: false, item: null });
      const [chatInput, setChatInput] = useState('');
      const [chatMessages, setChatMessages] = useState([
        { sender: 'seller', text: 'Hello! Welcome to AgriUS direct escrow negotiation chat.' }
      ]);

      // AI Agent State
      const [isAiOpen, setIsAiOpen] = useState(false);
      const [aiMessages, setAiMessages] = useState([
        { sender: 'agent', text: 'Hello! I am AgriUS AI. Ask me about certified on-site inspections, 0.7% Escrow, or Lowboy freight.' }
      ]);
      const [aiInput, setAiInput] = useState('');

      useEffect(() => {
        const interval = setInterval(() => {
          setCurrentAdIndex(prev => (prev + 1) % sponsoredAds.length);
        }, 5000);
        return () => clearInterval(interval);
      }, [sponsoredAds.length]);

      useEffect(() => {
        localStorage.setItem('agrius_equipment', JSON.stringify(equipmentList));
        localStorage.setItem('agrius_carriers', JSON.stringify(carriersList));
        localStorage.setItem('agrius_inspectors', JSON.stringify(inspectorsList));
        localStorage.setItem('agrius_mechanics', JSON.stringify(mechanicsList));
      }, [equipmentList, carriersList, inspectorsList, mechanicsList]);

      useEffect(() => {
        if (window.lucide) window.lucide.createIcons();
      }, [view, showListModal, showCarrierModal, showInspectorModal, showMechanicModal, showAdModal, showSubModal, activeLegalModal, selectedPassport, chatState, isAiOpen, currentAdIndex]);

      // Form States
      const [newEquipment, setNewEquipment] = useState({ title: '', category: 'Heavy Machinery', price: '', location: '', weight: '', seller: '', image: '' });
      const [newCarrier, setNewCarrier] = useState({ name: '', fleet: '', coverage: '', insurance: '', contact: '' });
      const [newInspector, setNewInspector] = useState({ name: '', company: '', specialty: '', rate: '', location: '', phone: '' });
      const [newAd, setNewAd] = useState({ title: '', type: 'Dealer', link: '#' });

      const handleAddEquipment = (e) => {
        e.preventDefault();
        const newItem = {
          ...newEquipment,
          id: Date.now(),
          price: parseFloat(newEquipment.price) || 0,
          approved: false,
          vin: `AGRI-${Math.floor(100000 + Math.random() * 900000)}`,
          healthScore: "95% Verified",
          image: newEquipment.image || "https://images.unsplash.com/photo-1592861956120-e524fc739696?auto=format&fit=crop&w=800&q=80"
        };
        setEquipmentList([newItem, ...equipmentList]);
        setShowListModal(false);
        alert("Listing submitted successfully! Pending Admin Approval.");
      };

      const handleAddInspector = (e) => {
        e.preventDefault();
        const item = {
          ...newInspector,
          id: `insp-${Date.now()}`,
          rating: "5.0 ★ (Certified Inspector)",
          image: "https://images.unsplash.com/photo-1560250097-0b93528c311a?auto=format&fit=crop&w=400&q=80"
        };
        setInspectorsList([item, ...inspectorsList]);
        setShowInspectorModal(false);
        alert("Inspector Profile published under ESIGN Legal Contract compliance!");
      };

      const handleAddAd = (e) => {
        e.preventDefault();
        setSponsoredAds([{ ...newAd, id: `ad-${Date.now()}` }, ...sponsoredAds]);
        setShowAdModal(false);
        alert("Sponsored Banner Ad submitted and queued successfully!");
      };

      const handleAiQuery = (queryText) => {
        const q = queryText || aiInput;
        if (!q.trim()) return;

        setAiMessages(prev => [...prev, { sender: 'user', text: q }]);
        if (!queryText) setAiInput('');

        setTimeout(() => {
          let reply = "AgriUS AI: I can assist with certified on-site inspections, 0.7% Escrow, or freight logistics.";
          const lower = q.toLowerCase();

          if (lower.includes('inspect') || lower.includes('فحص') || lower.includes('معاينة')) {
            reply = "You can dispatch a certified AgriUS inspector to perform a 50-point on-site audit before releasing escrow funds.";
          } else if (lower.includes('escrow') || lower.includes('0.7')) {
            reply = "Our transaction fee is just 0.7%, held safely in FDIC-insured escrow accounts until 48h post-delivery.";
          } else if (lower.includes('dealer') || lower.includes('39')) {
            reply = "Commercial Dealers pay $39/month for unlimited machinery listings and 3D AR hosting.";
          }

          setAiMessages(prev => [...prev, { sender: 'agent', text: reply }]);
        }, 800);
      };

      return (
        <div className="min-h-screen flex flex-col relative">
          
          {/* HEADER */}
          <header className="bg-slate-900 text-white sticky top-0 z-40 border-b border-slate-800 shadow-lg">
            <div className="max-w-7xl mx-auto px-4 py-3 flex justify-between items-center">
              <div className="flex items-center gap-3 cursor-pointer" onClick={() => setView('marketplace')}>
                <div className="bg-emerald-500 p-2 rounded-lg font-black text-slate-950 text-xl tracking-wider">AGRI-US</div>
                <div>
                  <h1 className="text-xl font-bold tracking-tight text-white">AgriUS Marketplace</h1>
                  <p className="text-xs text-emerald-400 font-medium">U.S. Machinery, Logistics & Certified On-Site Inspections</p>
                </div>
              </div>

              <nav className="hidden md:flex items-center gap-4 text-sm font-semibold">
                <button onClick={() => setView('marketplace')} className={`hover:text-emerald-400 ${view === 'marketplace' ? 'text-emerald-400 border-b-2 border-emerald-400 pb-1' : 'text-slate-300'}`}>
                  Machinery
                </button>
                <button onClick={() => setView('inspectors')} className={`hover:text-emerald-400 ${view === 'inspectors' ? 'text-emerald-400 border-b-2 border-emerald-400 pb-1' : 'text-slate-300'} flex items-center gap-1`}>
                  <i data-lucide="shield-check" className="w-4 h-4 text-emerald-400"></i> Inspections
                </button>
                <button onClick={() => setView('logistics')} className={`hover:text-emerald-400 ${view === 'logistics' ? 'text-emerald-400 border-b-2 border-emerald-400 pb-1' : 'text-slate-300'}`}>
                  Carriers
                </button>
                <button onClick={() => setView('mechanics')} className={`hover:text-emerald-400 ${view === 'mechanics' ? 'text-emerald-400 border-b-2 border-emerald-400 pb-1' : 'text-slate-300'}`}>
                  Mechanics
                </button>
                <button onClick={() => setView('amazonTools')} className={`hover:text-amber-400 ${view === 'amazonTools' ? 'text-amber-400 border-b-2 border-amber-400 pb-1' : 'text-slate-300'}`}>
                  Amazon Tools
                </button>
                <button onClick={() => setView('admin')} className={`hover:text-emerald-400 ${view === 'admin' ? 'text-emerald-400 border-b-2 border-emerald-400 pb-1' : 'text-slate-300'}`}>
                  Admin
                </button>
              </nav>

              <div className="flex items-center gap-2">
                <button onClick={() => setShowAdModal(true)} className="bg-amber-500 hover:bg-amber-600 text-slate-950 px-3 py-1.5 rounded-lg text-xs font-bold transition flex items-center gap-1">
                  <i data-lucide="megaphone" className="w-3.5 h-3.5"></i> Post Ad
                </button>
                <button onClick={() => setShowSubModal(true)} className="bg-emerald-500 hover:bg-emerald-600 text-slate-950 px-3 py-1.5 rounded-lg text-xs font-bold transition">
                  Dealer ($39/mo)
                </button>
              </div>
            </div>
          </header>

          {/* SPONSORED ROTATING ADS TICKER BANNER */}
          <div className="bg-gradient-to-r from-slate-800 via-indigo-950 to-slate-800 text-amber-300 text-xs py-2 px-4 border-b border-slate-700 shadow-inner flex justify-between items-center">
            <div className="flex items-center gap-2 mx-auto font-medium">
              <span className="bg-amber-500 text-slate-950 font-bold px-1.5 py-0.5 rounded text-[10px]">SPONSORED</span>
              <span>{sponsoredAds[currentAdIndex].title}</span>
            </div>
            <button onClick={() => setShowAdModal(true)} className="text-[10px] text-slate-400 hover:text-white underline whitespace-nowrap">
              Advertise ($19/wk)
            </button>
          </div>

          <main className="flex-grow max-w-7xl w-full mx-auto px-4 py-8">
            
            {/* VIEW 1: MARKETPLACE */}
            {view === 'marketplace' && (
              <div>
                <div className="mb-8 flex justify-between items-center bg-white p-6 rounded-xl shadow-sm border">
                  <div>
                    <h2 className="text-2xl font-black text-slate-900">U.S. Verified Heavy Machinery & Equipment</h2>
                    <p className="text-sm text-slate-500">Unbeatable 0.7% transaction escrow fee with Certified On-Site Inspection guarantee.</p>
                  </div>
                  <button onClick={() => setShowListModal(true)} className="bg-emerald-600 text-white font-bold px-4 py-2.5 rounded-lg text-xs">+ List Equipment</button>
                </div>

                <div className="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6">
                  {equipmentList.filter(i => i.approved).map(eq => (
                    <div key={eq.id} className="bg-white rounded-xl shadow-sm border overflow-hidden flex flex-col justify-between">
                      <div>
                        <div className="relative h-48 bg-slate-100">
                          <img src={eq.image} alt={eq.title} className="w-full h-full object-cover" />
                          <span className="absolute top-3 right-3 bg-slate-900/80 text-white text-xs font-semibold px-2.5 py-1 rounded-md">{eq.category}</span>
                        </div>
                        <div className="p-5">
                          <h3 className="font-bold text-slate-900 text-base mb-1">{eq.title}</h3>
                          <div className="text-xl font-black text-emerald-600 mb-3">${eq.price.toLocaleString()}</div>
                          <div className="text-xs text-slate-600 bg-slate-50 p-2.5 rounded border space-y-1">
                            <div><strong>Location:</strong> {eq.location}</div>
                            <div><strong>Health Score:</strong> <span className="text-emerald-700 font-bold">{eq.healthScore}</span></div>
                          </div>
                        </div>
                      </div>
                      <div className="p-5 pt-0 space-y-2">
                        <button onClick={() => setSelectedPassport(eq)} className="w-full bg-slate-100 hover:bg-slate-200 text-slate-800 text-xs font-bold py-2 rounded-lg border flex items-center justify-center gap-1">
                          <i data-lucide="shield-check" className="w-3.5 h-3.5 text-emerald-600"></i> Agri-VIN Health Passport
                        </button>
                        <button onClick={() => alert("Initiating 0.7% Escrow Checkout with On-Site Inspector dispatch option...")} className="w-full bg-emerald-600 hover:bg-emerald-700 text-white font-bold py-2.5 text-xs rounded-lg">
                          Buy with 0.7% Escrow
                        </button>
                      </div>
                    </div>
                  ))}
                </div>
              </div>
            )}

            {/* VIEW 2: CERTIFIED ON-SITE INSPECTORS NETWORK */}
            {view === 'inspectors' && (
              <div>
                <div className="mb-8 flex justify-between items-center bg-white p-6 rounded-xl shadow-sm border">
                  <div>
                    <h2 className="text-2xl font-black text-slate-900">AgriUS Certified On-Site Inspectors Network</h2>
                    <p className="text-xs text-slate-500">Dispatch a certified independent inspector to audit any heavy machinery before releasing escrow funds.</p>
                  </div>
                  <button onClick={() => setShowInspectorModal(true)} className="bg-indigo-600 text-white font-bold px-4 py-2.5 rounded-lg text-xs">
                    + Register as Certified Inspector
                  </button>
                </div>

                <div className="grid grid-cols-1 md:grid-cols-2 gap-6">
                  {inspectorsList.map(insp => (
                    <div key={insp.id} className="bg-white border rounded-xl p-6 shadow-sm flex flex-col justify-between">
                      <div>
                        <div className="flex gap-4 items-start mb-4">
                          <img src={insp.image} alt={insp.name} className="w-16 h-16 rounded-xl object-cover border" />
                          <div>
                            <h3 className="font-bold text-slate-900 text-base">{insp.name}</h3>
                            <p className="text-xs text-slate-500 font-semibold">{insp.company}</p>
                            <span className="inline-block bg-indigo-100 text-indigo-800 text-[10px] font-bold px-2 py-0.5 rounded mt-1">ESIGN Contractor Verified</span>
                          </div>
                        </div>
                        <div className="text-xs text-slate-700 bg-slate-50 p-3 rounded-lg border space-y-1 mb-4">
                          <div><strong>Specialty:</strong> {insp.specialty}</div>
                          <div><strong>Audit Fee:</strong> <span className="text-emerald-700 font-bold">{insp.rate}</span></div>
                          <div><strong>Service Region:</strong> {insp.location}</div>
                          <div><strong>Rating:</strong> {insp.rating}</div>
                        </div>
                      </div>
                      <button onClick={() => alert(`Dispatching Inspector ${insp.name} for on-site 50-point audit...`)} className="w-full bg-slate-900 hover:bg-slate-800 text-white font-bold py-2.5 text-xs rounded-lg">
                        Book Certified On-Site Audit ($350)
                      </button>
                    </div>
                  ))}
                </div>
              </div>
            )}

            {/* VIEW 3: CARRIERS */}
            {view === 'logistics' && (
              <div>
                <h2 className="text-2xl font-black text-slate-900 mb-6">U.S. Lowboy Freight Carriers</h2>
                <div className="grid grid-cols-1 md:grid-cols-2 gap-6">
                  {carriersList.map(car => (
                    <div key={car.id} className="bg-white border rounded-xl p-6 shadow-sm">
                      <h3 className="font-bold text-slate-900 text-lg mb-1">{car.name}</h3>
                      <p className="text-xs text-slate-500 mb-3">{car.fleet}</p>
                      <div className="text-xs text-slate-700 bg-slate-50 p-3 rounded border space-y-1 mb-4">
                        <div><strong>Coverage:</strong> {car.coverage}</div>
                        <div><strong>Insurance:</strong> <span className="text-emerald-700 font-bold">{car.insurance}</span></div>
                      </div>
                      <button onClick={() => alert("Requesting freight quote...")} className="w-full bg-slate-900 text-white font-bold py-2.5 text-xs rounded-lg">Request Quote</button>
                    </div>
                  ))}
                </div>
              </div>
            )}

            {/* VIEW 4: MECHANICS */}
            {view === 'mechanics' && (
              <div>
                <h2 className="text-2xl font-black text-slate-900 mb-6">Certified Mobile Mechanics</h2>
                <div className="grid grid-cols-1 md:grid-cols-2 gap-6">
                  {mechanicsList.map(mech => (
                    <div key={mech.id} className="bg-white border rounded-xl p-5 shadow-sm flex gap-4 items-center">
                      <img src={mech.image} alt={mech.name} className="w-20 h-20 rounded-xl object-cover border" />
                      <div>
                        <h3 className="font-bold text-slate-900 text-base">{mech.name}</h3>
                        <p className="text-xs text-slate-500">{mech.company}</p>
                        <div className="text-xs text-indigo-700 font-bold mt-1">Specialty: {mech.specialty}</div>
                        <div className="text-xs text-slate-600 mt-1">Rate: <span className="text-emerald-600 font-black">{mech.rate}</span></div>
                      </div>
                    </div>
                  ))}
                </div>
              </div>
            )}

            {/* VIEW 5: AMAZON TOOLS */}
            {view === 'amazonTools' && (
              <div>
                <div className="mb-8 bg-gradient-to-r from-amber-500 to-amber-600 text-slate-950 p-6 rounded-xl shadow-md">
                  <h2 className="text-2xl font-black mb-1">Manual Farm Tools & Gear (Amazon Storefront)</h2>
                  <p className="text-xs font-medium text-slate-900">Top-rated hand tools and mechanics kits fulfilled directly by Amazon Prime.</p>
                </div>
                <div className="grid grid-cols-1 md:grid-cols-2 gap-6">
                  {amazonTools.map(tool => (
                    <div key={tool.id} className="bg-white rounded-xl border p-5 flex gap-4 items-center">
                      <img src={tool.image} alt={tool.title} className="w-32 h-32 object-cover rounded-lg" />
                      <div>
                        <h3 className="font-bold text-slate-900 text-sm mb-1">{tool.title}</h3>
                        <div className="text-lg font-black text-amber-600 mb-2">${tool.price}</div>
                        <a href={tool.amazonUrl} target="_blank" rel="noopener noreferrer" className="bg-amber-500 text-slate-950 font-bold px-4 py-2 rounded text-xs inline-block">
                          Buy on Amazon
                        </a>
                      </div>
                    </div>
                  ))}
                </div>
              </div>
            )}

            {/* VIEW 6: ADMIN */}
            {view === 'admin' && (
              <div className="bg-white p-8 rounded-xl shadow-sm border">
                {!isAdminAuthenticated ? (
                  <div className="max-w-md mx-auto text-center py-12">
                    <h2 className="text-xl font-bold text-slate-900 mb-4">Owner Admin Login</h2>
                    <input type="password" placeholder="Password (admin123)" value={adminPassword} onChange={(e) => setAdminPassword(e.target.value)} className="w-full p-2.5 border rounded-lg mb-3 text-center text-sm" />
                    <button onClick={() => { if (adminPassword === 'admin123') setIsAdminAuthenticated(true); else alert("Wrong password"); }} className="w-full bg-slate-900 text-white font-bold py-2.5 rounded-lg text-sm">Login</button>
                  </div>
                ) : (
                  <div>
                    <h2 className="text-2xl font-bold text-slate-900 mb-2">Admin Control Center</h2>
                    <p className="text-xs text-slate-500">Active Listings: {equipmentList.length} | Certified Inspectors: {inspectorsList.length} | Fleets: {carriersList.length}</p>
                  </div>
                )}
              </div>
            )}
          </main>

          {/* MODAL: REGISTER CERTIFIED INSPECTOR */}
          {showInspectorModal && (
            <div className="fixed inset-0 bg-slate-900/60 backdrop-blur-sm z-50 flex items-center justify-center p-4">
              <div className="bg-white rounded-xl shadow-2xl max-w-xl w-full p-6 text-xs max-h-[90vh] overflow-y-auto space-y-4">
                <div className="flex justify-between items-center border-b pb-2">
                  <h3 className="font-bold text-base text-slate-900">Certified Inspector Registration & ESIGN Contract</h3>
                  <button onClick={() => setShowInspectorModal(false)} className="font-bold">✕</button>
                </div>
                
                <div className="bg-slate-50 p-3 rounded-lg border text-[11px] text-slate-600 max-h-36 overflow-y-auto leading-relaxed">
                  <strong className="text-slate-900">AgriUS Certified Inspector Agreement Summary:</strong>
                  <p className="mt-1">By submitting this registration, you agree to operate as an independent contractor (1099), execute 50-point equipment audits in compliance with AgriUS standards, carry professional liability insurance, and assign inspection copyright to AgriUS Marketplace LLC.</p>
                </div>

                <form onSubmit={handleAddInspector} className="space-y-3">
                  <input type="text" placeholder="Full Name & Certifications (e.g. ASE Master)" required className="w-full p-2 border rounded" value={newInspector.name} onChange={e => setNewInspector({...newInspector, name: e.target.value})} />
                  <input type="text" placeholder="Company / Inspection Unit Name" required className="w-full p-2 border rounded" value={newInspector.company} onChange={e => setNewInspector({...newInspector, company: e.target.value})} />
                  <input type="text" placeholder="Specialty (e.g. Hydraulics, Powertrain)" required className="w-full p-2 border rounded" value={newInspector.specialty} onChange={e => setNewInspector({...newInspector, specialty: e.target.value})} />
                  <div className="grid grid-cols-2 gap-2">
                    <input type="text" placeholder="Audit Fee ($350)" required className="p-2 border rounded" value={newInspector.rate} onChange={e => setNewInspector({...newInspector, rate: e.target.value})} />
                    <input type="text" placeholder="Phone Number" required className="p-2 border rounded" value={newInspector.phone} onChange={e => setNewInspector({...newInspector, phone: e.target.value})} />
                  </div>
                  <input type="text" placeholder="Service Region (State/States)" required className="w-full p-2 border rounded" value={newInspector.location} onChange={e => setNewInspector({...newInspector, location: e.target.value})} />
                  <button type="submit" className="w-full bg-indigo-600 hover:bg-indigo-700 text-white font-bold py-2.5 rounded text-xs">Agree & Sign as Certified Inspector</button>
                </form>
              </div>
            </div>
          )}

          {/* MODAL: POST SPONSORED AD */}
          {showAdModal && (
            <div className="fixed inset-0 bg-slate-900/60 backdrop-blur-sm z-50 flex items-center justify-center p-4">
              <div className="bg-white rounded-xl shadow-2xl max-w-md w-full p-6 text-xs">
                <div className="flex justify-between items-center border-b pb-2 mb-4">
                  <h3 className="font-bold text-base text-slate-900">Publish Sponsored Banner Ad ($19/wk)</h3>
                  <button onClick={() => setShowAdModal(false)} className="font-bold">✕</button>
                </div>
                <form onSubmit={handleAddAd} className="space-y-3">
                  <input type="text" placeholder="Ad Title / Message" required className="w-full p-2 border rounded" value={newAd.title} onChange={e => setNewAd({...newAd, title: e.target.value})} />
                  <select className="w-full p-2 border rounded" value={newAd.type} onChange={e => setNewAd({...newAd, type: e.target.value})}>
                    <option>Dealer</option>
                    <option>Logistics</option>
                    <option>Inspection</option>
                  </select>
                  <button type="submit" className="w-full bg-amber-500 text-slate-950 font-bold py-2.5 rounded text-xs mt-2">Publish Ad ($19/wk)</button>
                </form>
              </div>
            </div>
          )}

          {/* FLOATING AI SUPPORT */}
          <div className="fixed bottom-4 right-4 z-40">
            {!isAiOpen ? (
              <button onClick={() => setIsAiOpen(true)} className="bg-indigo-600 hover:bg-indigo-700 text-white p-3.5 rounded-full shadow-2xl flex items-center gap-2 text-xs font-bold transition">
                <i data-lucide="sparkles" className="w-5 h-5"></i>
                <span>Agri-AI Support</span>
              </button>
            ) : (
              <div className="w-80 sm:w-96 bg-white rounded-xl shadow-2xl border overflow-hidden flex flex-col h-[480px]">
                <div className="bg-indigo-700 text-white p-3.5 flex justify-between items-center">
                  <h4 className="font-bold text-xs">AgriUS AI Assistant</h4>
                  <button onClick={() => setIsAiOpen(false)} className="font-bold">✕</button>
                </div>
                <div className="flex-grow p-3 overflow-y-auto space-y-2 text-xs bg-slate-50">
                  {aiMessages.map((msg, idx) => (
                    <div key={idx} className={`flex ${msg.sender === 'user' ? 'justify-end' : 'justify-start'}`}>
                      <div className={`p-2.5 rounded-lg max-w-[85%] ${msg.sender === 'user' ? 'bg-indigo-600 text-white' : 'bg-white border text-slate-800'}`}>
                        {msg.text}
                      </div>
                    </div>
                  ))}
                </div>
                <div className="p-2 border-t bg-white flex gap-2">
                  <input type="text" placeholder="Ask Agri-AI..." value={aiInput} onChange={(e) => setAiInput(e.target.value)} onKeyDown={(e) => e.key === 'Enter' && handleAiQuery()} className="flex-grow p-2 border rounded text-xs" />
                  <button onClick={() => handleAiQuery()} className="bg-indigo-600 text-white px-3 py-2 rounded text-xs font-bold">Ask</button>
                </div>
              </div>
            )}
          </div>

          {/* FOOTER */}
          <footer className="bg-slate-950 text-slate-400 py-8 text-xs border-t border-slate-900">
            <div className="max-w-7xl mx-auto px-4 text-center">
              © 2026 AgriUS Marketplace LLC. Certified On-Site Inspections, Lowboy Carriers & Escrow Protection. All Rights Reserved.
            </div>
          </footer>
        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById('root')).render(<App />);
  </script>
</body>
</html>
